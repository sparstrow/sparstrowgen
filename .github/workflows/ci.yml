name: CI

# Runs on every pull request into main, so there is something for a required
# status check and GitHub auto-merge to wait on. The two jobs are the commands
# in .sparstrowgen/blueprint.yaml (`make check` and the Go suite), split so a
# failure says which half broke. Their names, `web` and `server`, are what the
# branch ruleset lists as required checks — renaming a job means changing the
# ruleset too.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  server:
    runs-on: ubuntu-latest
    # The store and api tests SKIP without a database rather than fail, which
    # would make this check much weaker than it looks (Makefile, test-linux).
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sparstrowgen
          POSTGRES_PASSWORD: sparstrowgen
          POSTGRES_DB: sparstrowgen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sparstrowgen -d sparstrowgen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://sparstrowgen:sparstrowgen@localhost:5432/sparstrowgen_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Build
        working-directory: server
        run: go build ./...

      - name: Test
        working-directory: server
        run: go test ./... -race
