name: Daemon release

# Two streams, and a tag decides which one (docs/runbooks/daemon-release.md,
# docs/Decisions.md D-035 and D-037):
#
#   daemon-vX.Y.Z             stable. Published as the latest release, so every
#                             installed computer with automatic updates on
#                             installs it within the hour, once no agent work is
#                             running.
#   daemon-candidate-vX.Y.Z   a release candidate. Published as a prerelease,
#                             never marked latest, and the moving
#                             `daemon-candidate` pointer is aimed at it. Only a
#                             computer on the candidate channel reads that
#                             pointer; no production computer does.
#
# The Promote workflow turns a candidate into the stable release WITHOUT
# rebuilding: it republishes the very bytes that were tested, checked against
# their SHA-256.

on:
  push:
    tags:
      - "daemon-v*.*.*"
      - "daemon-candidate-v*.*.*"

permissions:
  contents: write

concurrency:
  group: daemon-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag
        id: meta
        shell: pwsh
        run: |
          if ($env:TAG -match '^daemon-candidate-v(\d+\.\d+\.\d+)$') {
            $channel = 'candidate'
          } elseif ($env:TAG -match '^daemon-v(\d+\.\d+\.\d+)$') {
            $channel = 'stable'
          } else {
            throw "Release tags must be daemon-vX.Y.Z or daemon-candidate-vX.Y.Z; got '$env:TAG'."
          }
          $version = $Matches[1]
          # checkout turns an annotated tag into a lightweight one; fetch it again for its message.
          git fetch --force origin "refs/tags/$($env:TAG):refs/tags/$($env:TAG)"
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "$env:TAG is not on main. Only merged commits are released." }
          # Higher than the latest STABLE release, whichever stream this is: a
          # candidate that is not higher could never be promoted, and finding
          # that out at promotion time is finding out too late.
          $latest = gh release view --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $latest -match '^daemon-v(\d+\.\d+\.\d+)$') {
            if ([version]$version -le [version]$Matches[1]) { throw "$version is not higher than the latest release, $latest. Never reuse or go back." }
          }
          $global:LASTEXITCODE = 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test the daemon and its updates
        working-directory: server
        run: go test ./cmd/daemon/... ./cmd/releasetool/... ./internal/release/... ./internal/protocol/...

      - name: Build
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: ./scripts/package-windows.ps1 -Version $env:VERSION -Channel $env:CHANNEL

      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          $hash = ((Get-Content -LiteralPath dist/windows/sparstrowgen-setup.exe.sha256) -split '\s+')[0]
          $changes = (git tag -l --format='%(contents)' $env:TAG | Out-String).Trim()
          if (-not $changes) { $changes = 'See the commits since the previous release.' }
          $run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $notes = @'
          The component that connects a Windows computer to sparstrowgen.

          **What changed:** {CHANGES}

          **Updating:** installed computers install this by themselves within the hour, once no agent work is running. Check it in **Settings → Updates**. On 0.1.x, or on 0.2.0 or 0.2.1 if the computer missed 0.2.2, open `sparstrowgen-setup.exe` once.

          **Unsigned.** Windows will say it protected your PC. Choose **More info**, then **Run anyway**. Signing is tracked in KnownGaps G-32.

          SHA-256 `{HASH}`

          Built from {SHA} by [this run]({RUN}).
          '@
          $notes = $notes.Replace('{CHANGES}', $changes).Replace('{HASH}', $hash).Replace('{SHA}', $env:GITHUB_SHA).Replace('{RUN}', $run)
          if ($env:CHANNEL -eq 'candidate') {
            $notes = @'
          A release candidate of the component that connects a Windows computer to sparstrowgen. **Not for installed computers** — it is published for testing on the staging lane, and no computer on the stable channel sees it.

          **What changed:** {CHANGES}

          SHA-256 `{HASH}`

          Built from {SHA} by [this run]({RUN}). Promoting it to stable republishes these exact bytes, checked against that SHA-256.
          '@
            $notes = $notes.Replace('{CHANGES}', $changes).Replace('{HASH}', $hash).Replace('{SHA}', $env:GITHUB_SHA).Replace('{RUN}', $run)
          }
          Set-Content -LiteralPath release-notes.md -Value $notes -Encoding utf8

          if ($env:CHANNEL -eq 'candidate') {
            gh release create $env:TAG dist/windows/sparstrowgen-setup.exe dist/windows/sparstrowgen-setup.exe.sha256 dist/windows/sparstrowgen-update.json --verify-tag --prerelease --title "sparstrowgen for Windows $env:VERSION (release candidate)" --notes-file release-notes.md
            # Aim the moving pointer at this candidate. Candidate computers read
            # only this URL, so publishing the release above changes nothing for
            # anyone until this step runs.
            gh release view daemon-candidate 2>$null
            if ($LASTEXITCODE -ne 0) {
              $global:LASTEXITCODE = 0
              gh release create daemon-candidate --target $env:GITHUB_SHA --prerelease --title "Release candidate channel" --notes "The manifest computers on the candidate channel read. Its contents move with each candidate; the releases themselves are the daemon-candidate-vX.Y.Z prereleases."
            }
            $global:LASTEXITCODE = 0
            gh release upload daemon-candidate dist/windows/sparstrowgen-update.json --clobber
          } else {
            gh release create $env:TAG dist/windows/sparstrowgen-setup.exe dist/windows/sparstrowgen-setup.exe.sha256 dist/windows/sparstrowgen-update.json --verify-tag --latest --title "sparstrowgen for Windows $env:VERSION" --notes-file release-notes.md
          }
