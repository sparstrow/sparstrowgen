<!doctype html>
<html><head><meta charset="utf-8">
<title>Color</title>
<meta name="description" content="Color — foundation">
<link rel="stylesheet" href="../styles.css">
<style>
  html { color-scheme: dark; }
  body { margin:0; padding:var(--space-5,20px); background:var(--card,#161618); color:var(--foreground,#f4f4f5);
         font-family:var(--font-sans,system-ui); font-size:13px; }
  .row { display:grid; grid-template-columns:110px 1fr; gap:var(--space-4,16px); align-items:center;
         padding:var(--space-4,16px) 0; border-bottom:1px solid var(--border,#26262b); }
  .row:last-child { border-bottom:0; }
  .lbl { font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted-fg,#8a8a93); }
  .specimens { display:flex; flex-wrap:wrap; gap:var(--space-3,12px); align-items:center; }
  .swatch { width:112px; }
  .chip { height:52px; border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:8px; }
  .name { color:var(--foreground); font-weight:600; }
  .use { color:var(--muted-foreground); font-size:12px; margin-top:2px; }
  .background { background:var(--background); }
  .card { background:var(--card); }
  .primary { background:var(--primary); }
  .mine { background:var(--mine); }
  .destructive { background:var(--destructive); }
  .claude { background:var(--provider-claude); }
  .codex { background:var(--provider-codex); }
</style></head>
<body class="dark">
<div class="row"><div class="lbl">Surfaces</div><div class="specimens">
  <div class="swatch"><div class="chip background"></div><div class="name">Background</div><div class="use">Primary canvas</div></div>
  <div class="swatch"><div class="chip card"></div><div class="name">Card</div><div class="use">Bounded controls</div></div>
  <div class="swatch"><div class="chip primary"></div><div class="name">Primary</div><div class="use">One local action</div></div>
</div></div>
<div class="row"><div class="lbl">Meaning</div><div class="specimens">
  <div class="swatch"><div class="chip mine"></div><div class="name">Mine</div><div class="use">User prompts</div></div>
  <div class="swatch"><div class="chip destructive"></div><div class="name">Destructive</div><div class="use">Fault or removal</div></div>
  <div class="swatch"><div class="chip claude"></div><div class="name">Claude</div><div class="use">Provider only</div></div>
  <div class="swatch"><div class="chip codex"></div><div class="name">Codex</div><div class="use">Provider only</div></div>
</div></div>
</body></html>
