<!doctype html>
<html lang="en" class="dark"><head><meta charset="utf-8">
<title>Machine workspace</title>
<meta name="description" content="US2 — dedicated Machines list and focused machine profile. Open the live prototype to review pairing and all states.">
<link rel="stylesheet" href="../../styles.css">
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--background);color:var(--foreground);font:400 var(--text-meta)/1.45 var(--font-sans)}
  .shell{display:grid;grid-template-columns:112px 1fr;min-height:100vh}.side{padding:14px 10px;border-right:1px solid var(--border);background:color-mix(in oklch,var(--card) 54%,var(--background))}.brand{padding:4px 7px 16px;font-size:var(--text-body);font-weight:600}.nav{padding:7px;border-radius:var(--radius-md);color:var(--muted-foreground)}.nav.on{background:var(--accent);color:var(--accent-foreground);font-weight:500}
  .content{padding:22px}.top{display:flex;align-items:start;justify-content:space-between;margin-bottom:18px}.top h1{margin:0;font-size:var(--text-title);font-weight:600}.top p{margin:2px 0 0;color:var(--muted-foreground)}.button{padding:6px 10px;border-radius:var(--radius-md);background:var(--primary);color:var(--primary-foreground);font-weight:500}
  .split{display:grid;grid-template-columns:.82fr 1.18fr;gap:16px}.panel{overflow:hidden;border:1px solid var(--border);border-radius:var(--radius-lg)}.row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border-bottom:1px solid var(--border)}.row:last-child{border:0}.row strong{font-weight:500}.muted{color:var(--muted-foreground)}.profile{padding:15px}.profile h2{margin:0;font-size:var(--text-body);font-weight:600}.status{display:inline-flex;gap:4px;margin-left:8px;color:var(--muted-foreground);font-size:var(--text-meta)}.section{margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}.provider{display:flex;justify-content:space-between;padding:7px 0}.badge{padding:2px 6px;border-radius:999px;background:var(--secondary);color:var(--secondary-foreground)}
</style></head><body>
<div class="shell"><aside class="side"><div class="brand">sparstrowgen</div><div class="nav">Chat</div><div class="nav on">Machines</div></aside><main class="content"><header class="top"><div><h1>Machines</h1><p>Computers connected to your account.</p></div><span class="button">+ Add computer</span></header><div class="split"><section class="panel"><div class="row"><span><strong>DESKTOP-RIVER</strong><br><span class="muted">3 providers · just now</span></span><span class="badge">Online</span></div><div class="row"><span><strong>FINANCE-LAPTOP</strong><br><span class="muted">2 providers · yesterday</span></span><span class="muted">Offline</span></div></section><section class="panel profile"><h2>DESKTOP-RIVER <span class="status">● Online</span></h2><div class="muted">This computer · last seen just now</div><div class="section"><strong>Agent providers</strong><div class="provider"><span>Claude</span><span>Available</span></div><div class="provider"><span>Codex</span><span>Available</span></div><div class="provider"><span>agy</span><span>Available</span></div></div></section></div></main></div>
</body></html>
