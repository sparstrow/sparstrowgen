<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Machine workspace prototype</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; background: var(--background); }
    body { margin: 0; min-width: 780px; min-height: 100vh; overflow: hidden; background: var(--background); color: var(--foreground); font: 400 var(--text-ui)/1.5 var(--font-sans); }
    button, select { font: inherit; }
    button { color: inherit; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .app { display: grid; grid-template-columns: 15rem minmax(0, 1fr); min-height: 100vh; }
    .sidebar { display: flex; flex-direction: column; min-width: 0; padding: var(--space-4); border-right: 1px solid var(--border); background: color-mix(in oklch, var(--card) 54%, var(--background)); }
    .brand { display: flex; align-items: center; height: 36px; padding: 0 var(--space-2); font-size: var(--text-title); font-weight: 600; letter-spacing: -.015em; }
    .nav { display: flex; flex-direction: column; gap: var(--space-1); margin-top: var(--space-6); }
    .nav-button, .account-button { display: flex; align-items: center; gap: var(--space-3); width: 100%; height: 36px; padding: 0 var(--space-3); border: 0; border-radius: var(--radius-md); background: transparent; color: var(--muted-foreground); text-align: left; cursor: pointer; }
    .nav-button:hover, .account-button:hover { background: var(--muted); color: var(--foreground); }
    .nav-button[aria-current="page"] { background: var(--accent); color: var(--accent-foreground); font-weight: 500; }
    .nav-button:focus-visible, .account-button:focus-visible, .button:focus-visible, .machine-row:focus-visible, .crumb:focus-visible, .review button:focus-visible, .review select:focus-visible { outline: 3px solid color-mix(in oklch, var(--ring) 50%, transparent); outline-offset: 1px; }
    .sidebar-footer { margin-top: auto; padding-top: var(--space-4); border-top: 1px solid var(--border); }
    .account-button { height: auto; min-height: 44px; }
    .avatar { display: grid; place-items: center; flex: 0 0 auto; width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 999px; background: var(--secondary); color: var(--secondary-foreground); font-size: var(--text-meta); }
    .account-copy { min-width: 0; }
    .account-copy strong, .account-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .account-copy strong { color: var(--foreground); font-weight: 500; }
    .account-copy span { font-size: var(--text-meta); }
    .main { min-width: 0; height: 100vh; overflow: auto; }
    .page { width: min(100%, 78rem); margin: 0 auto; padding: var(--space-8); padding-bottom: 88px; }
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-6); margin-bottom: var(--space-8); }
    .page-title { margin: 0; font-size: var(--text-title); line-height: 1.25; font-weight: 600; letter-spacing: -.015em; }
    .page-description { margin: var(--space-1) 0 0; color: var(--muted-foreground); }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: 32px; padding: 0 10px; border: 1px solid transparent; border-radius: var(--radius-lg); background: var(--primary); color: var(--primary-foreground); font-weight: 500; white-space: nowrap; cursor: pointer; transition: background-color 150ms ease-out, color 150ms ease-out, opacity 150ms ease-out; }
    .button:hover { background: color-mix(in oklch, var(--primary), var(--primary-foreground) 18%); }
    .button.outline { border-color: var(--input); background: var(--background); color: var(--foreground); }
    .button.outline:hover, .button.ghost:hover { background: var(--muted); color: var(--foreground); }
    .button.ghost { background: transparent; color: var(--muted-foreground); }
    .button.destructive { background: color-mix(in oklch, var(--destructive) 16%, transparent); color: var(--destructive); }
    .button.destructive:hover { background: color-mix(in oklch, var(--destructive) 24%, transparent); }
    .button:disabled { opacity: .5; pointer-events: none; }
    .button svg, .nav-button svg, .account-button svg { width: 1rem; height: 1rem; flex: 0 0 auto; }
    .badge { display: inline-flex; align-items: center; gap: var(--space-1); width: fit-content; min-height: 20px; padding: 1px var(--space-2); border: 1px solid transparent; border-radius: 999px; background: var(--secondary); color: var(--secondary-foreground); font-size: var(--text-meta); font-weight: 500; white-space: nowrap; }
    .status { display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap; }
    .status svg { width: .875rem; height: .875rem; }
    .status.offline { color: var(--muted-foreground); }
    .machine-table { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: color-mix(in oklch, var(--card) 40%, transparent); }
    .machine-table-head, .machine-row { display: grid; grid-template-columns: minmax(280px, 1.25fr) minmax(96px, .5fr) minmax(128px, .65fr) minmax(96px, .5fr) minmax(112px, .55fr) 24px; align-items: center; gap: var(--space-4); padding: 0 var(--space-5); }
    .machine-table-head { height: 42px; color: var(--muted-foreground); font-size: var(--text-meta); border-bottom: 1px solid var(--border); }
    .machine-row { width: 100%; min-height: 70px; border: 0; border-bottom: 1px solid var(--border); background: transparent; text-align: left; cursor: pointer; }
    .machine-row:last-child { border-bottom: 0; }
    .machine-row:hover { background: color-mix(in oklch, var(--muted) 55%, transparent); }
    .machine-cell { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
    .machine-cell strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .machine-icon, .setup-icon { display: grid; place-items: center; flex: 0 0 auto; width: 38px; height: 38px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--background); }
    .machine-icon svg, .setup-icon svg { width: 20px; height: 20px; }
    .muted { color: var(--muted-foreground); }
    .literal { font-family: var(--font-mono); }
    .chevron { width: 1rem; height: 1rem; color: var(--muted-foreground); }
    .crumbs { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-6); color: var(--muted-foreground); font-size: var(--text-meta); }
    .crumbs svg { width: .75rem; height: .75rem; }
    .crumb { border: 0; padding: 0; background: transparent; color: inherit; cursor: pointer; }
    .crumb:hover { color: var(--foreground); text-decoration: underline; text-underline-offset: 3px; }
    .profile-header { display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-8); }
    .profile-heading { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); min-width: 0; }
    .profile-heading h1 { margin: 0; font-size: var(--text-title); font-weight: 600; letter-spacing: -.015em; }
    .profile-meta { width: 100%; color: var(--muted-foreground); }
    .profile-action { margin-left: auto; align-self: flex-start; }
    .section { padding: var(--space-6) 0; border-top: 1px solid var(--border); }
    .section-title { margin: 0; font-size: var(--text-body); font-weight: 600; }
    .section-description { margin: var(--space-1) 0 var(--space-4); color: var(--muted-foreground); }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { height: 36px; color: var(--muted-foreground); font-size: var(--text-meta); font-weight: 400; text-align: left; }
    .data-table td { height: 54px; border-top: 1px solid var(--border); }
    .provider { display: inline-flex; align-items: center; gap: var(--space-3); font-weight: 500; }
    .provider > svg { width: 1rem; height: 1rem; flex: 0 0 auto; }
    .provider-mark { width: 18px; height: 18px; }
    .provider-claude { color: var(--provider-claude); }
    .provider-codex { color: var(--provider-codex); }
    .provider-agy { color: var(--provider-agy); }
    .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .fact { padding-right: var(--space-6); }
    .fact + .fact { padding-left: var(--space-6); border-left: 1px solid var(--border); }
    .fact span, .fact strong { display: block; }
    .fact span { color: var(--muted-foreground); font-size: var(--text-meta); }
    .fact strong { margin-top: var(--space-1); font-weight: 500; }
    .empty { display: grid; place-items: center; min-height: 430px; text-align: center; }
    .empty-inner { display: flex; flex-direction: column; align-items: center; max-width: 28rem; }
    .empty-icon { display: grid; place-items: center; width: 44px; height: 44px; margin-bottom: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); }
    .empty-icon svg { width: 22px; height: 22px; }
    .empty h2, .alert h2, .setup h2 { margin: 0; font-size: var(--text-body); font-weight: 600; }
    .empty p { margin: var(--space-2) 0 var(--space-5); color: var(--muted-foreground); }
    .alert { display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-3); align-items: start; padding: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); }
    .alert.error { border-color: color-mix(in oklch, var(--destructive) 45%, var(--border)); }
    .alert > svg { width: 18px; height: 18px; margin-top: 1px; color: var(--destructive); }
    .alert p, .setup p { margin: var(--space-1) 0 0; color: var(--muted-foreground); }
    .skeleton-table { overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .skeleton-row { display: grid; grid-template-columns: 2fr 1fr 1.3fr 1fr; gap: var(--space-6); align-items: center; height: 70px; padding: 0 var(--space-5); border-bottom: 1px solid var(--border); }
    .skeleton-row:last-child { border-bottom: 0; }
    .skeleton { height: 12px; border-radius: var(--radius-sm); background: var(--muted); animation: pulse 1.5s ease-in-out infinite; }
    .skeleton.short { width: 48%; }
    .setup { max-width: 42rem; margin: 0 auto; padding-top: var(--space-8); }
    .setup-back { margin-bottom: var(--space-8); }
    .setup-icon { width: 44px; height: 44px; margin-bottom: var(--space-5); background: var(--card); }
    .setup h1 { margin: 0; font-size: var(--text-title); font-weight: 600; }
    .setup-lead { margin: var(--space-2) 0 0; max-width: 65ch; }
    .setup-panel { margin-top: var(--space-8); padding-top: var(--space-6); border-top: 1px solid var(--border); }
    .actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-5); }
    .request { display: grid; grid-template-columns: auto 1fr; gap: var(--space-4); margin-top: var(--space-5); padding: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); }
    .request .machine-icon { grid-row: span 2; }
    .request strong { font-weight: 600; }
    .request span { color: var(--muted-foreground); }
    .spinner { animation: spin .9s linear infinite; }
    .review { position: fixed; left: 50%; bottom: var(--space-4); display: flex; align-items: center; gap: var(--space-2); transform: translateX(-50%); padding: var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--popover); color: var(--popover-foreground); }
    .review-label { padding: 0 var(--space-2); color: var(--muted-foreground); font-size: var(--text-meta); }
    .review select, .review button { height: 30px; border: 1px solid var(--input); border-radius: var(--radius-md); background: var(--background); color: var(--foreground); }
    .review select { padding: 0 28px 0 var(--space-2); }
    .review button { padding: 0 var(--space-2); cursor: pointer; }
    .dialog-layer { position: fixed; inset: 0; display: grid; place-items: center; padding: var(--space-6); background: color-mix(in oklch, var(--background) 76%, transparent); }
    .dialog-layer[hidden] { display: none; }
    .dialog { width: min(100%, 380px); overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--popover); color: var(--popover-foreground); }
    .dialog-content, .dialog-footer { padding: var(--space-4); }
    .dialog h2 { margin: 0; font-size: var(--text-body); font-weight: 600; }
    .dialog p { margin: var(--space-2) 0 0; color: var(--muted-foreground); }
    .dialog-footer { display: flex; justify-content: flex-end; gap: var(--space-2); border-top: 1px solid var(--border); background: color-mix(in oklch, var(--muted) 50%, transparent); }
    .toast { position: fixed; right: var(--space-5); bottom: var(--space-5); max-width: 320px; padding: var(--space-3) var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--popover); color: var(--popover-foreground); opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity 180ms ease-out, transform 180ms ease-out; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
    @media (max-width: 1000px) { .machine-table-head { display: none; } .machine-row { grid-template-columns: minmax(220px, 1fr) auto 24px; } .hide-compact { display: none; } }
  </style>
</head>

  </div>
  <div class="review" aria-label="Prototype controls"><span class="review-label">Prototype only</span><select id="preview-state" aria-label="Preview list state"><option value="populated">Populated</option><option value="empty">Empty</option><option value="loading">Loading</option><option value="error">Error</option></select><button data-action="preview-mismatch">Pairing mismatch</button></div>
  <div id="dialog-layer" class="dialog-layer" hidden><section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-description" data-component="AlertDialog"><div class="dialog-content"><h2 id="dialog-title">Disconnect DESKTOP-RIVER?</h2><p id="dialog-description">Any active work on this computer will end. Your conversations stay here, and this computer will need your approval before it can connect again.</p></div><div class="dialog-footer"><button class="button outline" data-action="cancel-disconnect">Keep connected</button><button class="button destructive" data-action="confirm-disconnect">Disconnect</button></div></section></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="../../lib/sparstrowgen-data.js"></script>
  <script>
    const seed = window.SPARSTROW_SEED;
    const state = {
      view: "list",
      preview: "populated",
      selectedId: seed.machines[0].id,
      setupStep: "intro",
      disconnected: false,
      searchTimer: null,
      lastDialogTrigger: null,
    };
    const main = document.querySelector("#main");
    const previewSelect = document.querySelector("#preview-state");
    const dialogLayer = document.querySelector("#dialog-layer");
    const toast = document.querySelector("#toast");

    const icon = (name, className = "") => `<svg class="${className}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
    const providerMark = (id) => `<svg class="provider-mark provider-${id}" aria-hidden="true"><use href="#p-${id}"></use></svg>`;
    const machineStatus = (machine) => machine.status === "online"
      ? `<span class="status">${icon("check")}Online</span>`
      : `<span class="status offline">${icon("offline")}Offline</span>`;
    const setupStatus = (status) => status === "Available"
      ? `<span class="status">${icon("check")}Available</span>`
      : `<span class="status offline">${icon("offline")}${status}</span>`;

    function pageHeader(action = true) {
      return `<header class="page-header"><div><h1 class="page-title">Machines</h1><p class="page-description">Computers connected to your account.</p></div>${action ? `<button class="button" data-action="add-machine">${icon("plus")}Add computer</button>` : ""}</header>`;
    }

    function renderList() {
      if (state.preview === "empty") {
        main.innerHTML = `<div class="page">${pageHeader(false)}<section class="empty" data-component="Empty"><div class="empty-inner"><div class="empty-icon">${icon("monitor")}</div><h2>No computers connected</h2><p>Connect a computer to use its folders and agent providers from sparstrowgen.</p><button class="button" data-action="add-machine">${icon("plus")}Connect a computer</button></div></section></div>`;
        return;
      }
      if (state.preview === "loading") {
        main.innerHTML = `<div class="page">${pageHeader()}<div class="skeleton-table" aria-label="Loading machines" data-component="Skeleton">${[1,2,3].map(() => `<div class="skeleton-row"><span class="skeleton"></span><span class="skeleton short"></span><span class="skeleton"></span><span class="skeleton short"></span></div>`).join("")}</div></div>`;
        return;
      }
      if (state.preview === "error") {
        main.innerHTML = `<div class="page">${pageHeader()}<section class="alert error" role="alert">${icon("alert")}<div><h2>Machines could not be loaded</h2><p>The connection to sparstrowgen was interrupted. Your computers have not been changed.</p></div><button class="button outline" data-action="retry-list">${icon("refresh")}Try again</button></section></div>`;
        return;
      }

      main.innerHTML = `<div class="page">${pageHeader()}<div class="machine-table" role="table" aria-label="Connected machines" data-component="Table"><div class="machine-table-head" role="row"><span role="columnheader">Computer</span><span role="columnheader">Status</span><span role="columnheader" class="hide-compact">Providers</span><span role="columnheader" class="hide-compact">Active work</span><span role="columnheader" class="hide-compact">Last seen</span><span></span></div>${seed.machines.map((machine) => `<button class="machine-row" role="row" data-action="open-machine" data-machine-id="${machine.id}"><span class="machine-cell" role="cell"><span class="machine-icon">${icon("monitor")}</span><strong>${machine.name}</strong>${machine.thisDevice ? `<span class="badge">This computer</span>` : ""}</span><span role="cell">${machineStatus(machine)}</span><span role="cell" class="hide-compact muted">${machine.providers.length} configured</span><span role="cell" class="hide-compact muted">${machine.activeWork}</span><span role="cell" class="hide-compact muted">${machine.lastSeen}</span>${icon("chevron", "chevron")}</button>`).join("")}</div></div>`;
    }

    function renderProfile() {
      const machine = seed.machines.find((item) => item.id === state.selectedId) || seed.machines[0];
      const connected = !state.disconnected;
      main.innerHTML = `<div class="page"><nav class="crumbs" aria-label="Breadcrumb" data-component="Breadcrumb"><button class="crumb" data-action="machines">Machines</button>${icon("chevron")}<span aria-current="page">${machine.name}</span></nav><header class="profile-header"><div class="machine-icon">${icon("monitor")}</div><div class="profile-heading"><h1>${machine.name}</h1>${connected ? machineStatus(machine) : `<span class="status offline">${icon("offline")}Disconnected</span>`}${machine.thisDevice ? `<span class="badge">This computer</span>` : ""}<div class="profile-meta">${connected ? `Last seen ${machine.lastSeen}` : "This computer no longer has access to your account."}</div></div><div class="profile-action">${connected ? `<button class="button destructive" data-action="open-disconnect">${icon("unplug")}Disconnect</button>` : `<button class="button outline" data-action="pair-again">${icon("refresh")}Pair again</button>`}</div></header>${!connected ? `<section class="alert"><div class="machine-icon">${icon("check")}</div><div><h2>Computer disconnected</h2><p>Its credential was revoked. Conversations remain available and the computer can be paired again with your approval.</p></div></section>` : ""}<section class="section"><h2 class="section-title">Agent providers</h2><p class="section-description">Providers this computer can make available to new work.</p><table class="data-table"><thead><tr><th>Provider</th><th>Availability</th></tr></thead><tbody>${machine.providers.map((provider) => `<tr><td><span class="provider">${providerMark(provider.id)}${provider.name}</span></td><td>${connected ? setupStatus(machine.status === "online" ? provider.status : "Waiting for computer") : `<span class="status offline">${icon("offline")}Disconnected</span>`}</td></tr>`).join("")}</tbody></table></section><section class="section"><h2 class="section-title">Registered folders</h2><p class="section-description">Folders this computer has made available for work.</p><table class="data-table"><thead><tr><th>Folder</th></tr></thead><tbody>${machine.folders.map((folder) => `<tr><td><span class="provider">${icon("folder")}<span class="literal">${folder}</span></span></td></tr>`).join("")}</tbody></table></section><section class="section"><h2 class="section-title">Connection</h2><p class="section-description">Account and activity details for this computer.</p><div class="facts"><div class="fact"><span>Account</span><strong>srihari@sparstrow.com</strong></div><div class="fact"><span>Activity</span><strong>${connected ? machine.activeWork : "None"}</strong></div><div class="fact"><span>Last seen</span><strong>${machine.lastSeen}</strong></div></div></section></div>`;
    }

    function setupChrome(content) {
      return `<div class="page"><section class="setup"><button class="button ghost setup-back" data-action="machines">${icon("back")}Back to machines</button>${content}</section></div>`;
    }

    function renderSetup() {
      let content = "";
      if (state.setupStep === "intro") content = `<div class="setup-icon">${icon("monitor")}</div><h1>Connect this computer</h1><p class="setup-lead">We’ll look for a sparstrowgen pairing request from this computer. You will approve the computer here before it receives access.</p><div class="setup-panel"><h2>Ready to look?</h2><p>Open this page on the Windows computer you want to connect.</p><div class="actions"><button class="button" data-action="find-computer">Find this computer</button><button class="button outline" data-action="download-installer">${icon("download")}Get Windows installer</button></div></div>`;
      if (state.setupStep === "searching") content = `<div class="setup-icon">${icon("loader", "spinner")}</div><h1>Looking for this computer</h1><p class="setup-lead">Waiting for a new pairing request on your account. Keep the sparstrowgen app open on the computer.</p><div class="setup-panel"><span class="status muted">${icon("loader", "spinner")}Waiting for a response…</span></div>`;
      if (state.setupStep === "not-found") content = `<div class="setup-icon">${icon("offline")}</div><h1>This computer has not answered yet</h1><p class="setup-lead">Nothing was connected. Make sure sparstrowgen is open on the computer, then try again.</p><div class="actions"><button class="button" data-action="retry-pairing">${icon("refresh")}Try again</button><button class="button outline" data-action="download-installer">${icon("download")}Get Windows installer</button><button class="button ghost" data-action="machines">Not now</button></div>`;
      if (state.setupStep === "approval") content = `<div class="setup-icon">${icon("monitor")}</div><h1>Approve this computer?</h1><p class="setup-lead">Only approve a computer you recognise. Approval gives it access to your sparstrowgen account.</p><div class="request"><span class="machine-icon">${icon("monitor")}</span><strong>DESKTOP-RIVER</strong><span>Windows · Request received just now</span></div><div class="actions"><button class="button" data-action="approve-computer">Approve computer</button><button class="button outline" data-action="reject-computer">Not this computer</button></div>`;
      if (state.setupStep === "mismatch") content = `<div class="setup-icon">${icon("alert")}</div><h1>This pairing request changed</h1><p class="setup-lead">The approval no longer matches the computer that requested it, so nothing was connected. Start again and approve the new request shown here.</p><div class="actions"><button class="button" data-action="retry-pairing">${icon("refresh")}Start again</button><button class="button ghost" data-action="machines">Back to machines</button></div>`;
      if (state.setupStep === "success") content = `<div class="setup-icon">${icon("check")}</div><h1>DESKTOP-RIVER is connected</h1><p class="setup-lead">This computer can now make its registered folders and agent providers available to your account.</p><div class="actions"><button class="button" data-action="view-new-machine">View machine profile${icon("chevron")}</button></div>`;
      main.innerHTML = setupChrome(content);
    }

    function updateUrl() {
      const params = new URLSearchParams();
      if (state.view !== "list") params.set("view", state.view);
      if (state.view === "list" && state.preview !== "populated") params.set("state", state.preview);
      if (state.view === "profile") params.set("machine", state.selectedId);
      history.replaceState(null, "", `${location.pathname}${params.size ? `?${params}` : ""}`);
    }

    function render({ focusMain = false } = {}) {
      clearTimeout(state.searchTimer);
      document.querySelector('[data-action="machines"]').setAttribute("aria-current", "page");
      if (state.view === "list") renderList();
      if (state.view === "profile") renderProfile();
      if (state.view === "setup") renderSetup();
      previewSelect.value = state.preview;
      updateUrl();
      if (focusMain) main.focus();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2400);
    }

    function startSearch(result) {
      state.view = "setup";
      state.setupStep = "searching";
      render();
      state.searchTimer = setTimeout(() => {
        state.setupStep = result;
        render();
      }, 1500);
    }

    function openDialog(trigger) {
      state.lastDialogTrigger = trigger;
      const machine = seed.machines.find((item) => item.id === state.selectedId) || seed.machines[0];
      dialogLayer.querySelector("#dialog-title").textContent = `Disconnect ${machine.name}?`;
      dialogLayer.hidden = false;
      dialogLayer.querySelector('[data-action="cancel-disconnect"]').focus();
    }

    function closeDialog() {
      dialogLayer.hidden = true;
      state.lastDialogTrigger?.focus();
    }

    document.addEventListener("click", (event) => {
      const target = event.target.closest("[data-action]");
      if (!target) return;
      const action = target.dataset.action;
      if (action === "machines") { state.view = "list"; state.preview = "populated"; render({ focusMain: true }); }
      if (action === "open-machine") { state.selectedId = target.dataset.machineId; state.view = "profile"; state.disconnected = false; render({ focusMain: true }); }
      if (action === "add-machine" || action === "pair-again") { state.view = "setup"; state.setupStep = "intro"; render({ focusMain: true }); }
      if (action === "find-computer") startSearch("not-found");
      if (action === "retry-pairing") startSearch("approval");
      if (action === "approve-computer") { state.setupStep = "success"; render({ focusMain: true }); }
      if (action === "reject-computer") { state.setupStep = "mismatch"; render({ focusMain: true }); }
      if (action === "view-new-machine") { state.selectedId = "desktop-river"; state.view = "profile"; state.disconnected = false; render({ focusMain: true }); }
      if (action === "retry-list") { state.preview = "loading"; render(); setTimeout(() => { state.preview = "populated"; render(); }, 1200); }
      if (action === "preview-mismatch") { state.view = "setup"; state.setupStep = "mismatch"; render({ focusMain: true }); }
      if (action === "open-disconnect") openDialog(target);
      if (action === "cancel-disconnect") closeDialog();
      if (action === "confirm-disconnect") { const machine = seed.machines.find((item) => item.id === state.selectedId) || seed.machines[0]; closeDialog(); state.disconnected = true; render(); showToast(`${machine.name} disconnected`); }
      if (action === "download-installer") showToast("Prototype: installer download is not connected yet.");
      if (action === "chat") showToast("Chat is outside this prototype.");
      if (action === "account") showToast("Account settings are outside this prototype.");
    });

    previewSelect.addEventListener("change", () => {
      state.view = "list";
      state.preview = previewSelect.value;
      render({ focusMain: true });
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !dialogLayer.hidden) closeDialog();
      if (event.key === "Tab" && !dialogLayer.hidden) {
        const controls = [...dialogLayer.querySelectorAll("button")];
        const first = controls[0];
        const last = controls[controls.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });

    const params = new URLSearchParams(location.search);
    if (["list", "profile", "setup"].includes(params.get("view"))) state.view = params.get("view");
    if (["populated", "empty", "loading", "error"].includes(params.get("state"))) state.preview = params.get("state");
    if (seed.machines.some((machine) => machine.id === params.get("machine"))) state.selectedId = params.get("machine");
    render();
  </script>
</body>
</html>
