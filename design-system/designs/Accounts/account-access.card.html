<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<title>Account access</title>
<meta name="description" content="US1 — invitation-only registration, email confirmation, sign in and password reset. Open live for the clickable prototype.">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--background); color: var(--foreground); font-family: "Geist", ui-sans-serif, system-ui, sans-serif; font-size: 13px; }
  .col { max-width: 260px; margin: 28px auto; }
  h1 { font-size: 15px; font-weight: 500; margin: 0 0 2px; }
  .t { color: var(--muted-foreground); margin: 0 0 18px; }
  label { display: block; color: var(--muted-foreground); margin: 10px 0 6px; }
  .in { height: 28px; border: 1px solid var(--input); border-radius: var(--radius); background: color-mix(in oklch, var(--input) 30%, transparent); padding: 5px 8px; }
  .hint { font-size: 11px; color: var(--muted-foreground); margin-top: 6px; }
  .b { margin-top: 14px; height: 28px; border-radius: var(--radius); background: var(--primary); color: var(--primary-foreground); display: flex; align-items: center; justify-content: center; font-weight: 500; }
</style>
</head>
<body>
  <div class="col">
    <h1>sparstrowgen</h1>
    <p class="t">Create your account</p>
    <label>Email</label>
    <div class="in">priya.nair@northwindlogistics.com</div>
    <p class="hint">sparstrowgen is by invitation. Use the address your invitation was sent to.</p>
    <div class="b">Continue</div>
  </div>
</body>
</html>
