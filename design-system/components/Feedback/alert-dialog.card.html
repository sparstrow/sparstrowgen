<!doctype html>
<html><head><meta charset="utf-8">
<title>Alert dialog</title>
<meta name="description" content="Alert dialog — variants and states">
<link rel="stylesheet" href="../../styles.css">
<style>
  html { color-scheme: dark; }
  body { margin:0; padding:var(--space-5,20px); background:var(--card,#161618); color:var(--foreground,#f4f4f5);
         font-family:var(--font-sans,system-ui); font-size:13px; }
  .row { display:grid; grid-template-columns:110px 1fr; gap:var(--space-4,16px); align-items:center;
         padding:var(--space-4,16px) 0; border-bottom:1px solid var(--border,#26262b); }
  .row:last-child { border-bottom:0; }
  .lbl { font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted-fg,#8a8a93); }
  .specimens { display:flex; flex-wrap:wrap; gap:var(--space-3,12px); align-items:center; }
  .dialog { width:min(100%,350px); background:var(--popover); color:var(--popover-foreground); border:1px solid var(--border); border-radius:var(--radius-xl); overflow:hidden; }
  .content { padding:16px; display:grid; gap:8px; }
  h2 { margin:0; font-size:var(--text-body); font-weight:500; }
  p { margin:0; color:var(--muted-foreground); font-size:var(--text-ui); line-height:1.5; }
  .footer { padding:12px 16px; display:flex; justify-content:flex-end; gap:8px; background:color-mix(in oklch,var(--muted) 50%,transparent); border-top:1px solid var(--border); }
  button { height:32px; padding:0 10px; border-radius:var(--radius-lg); border:1px solid var(--input); background:var(--background); color:var(--foreground); font:500 var(--text-ui)/1 var(--font-sans); }
  .danger { border-color:transparent; background:color-mix(in oklch,var(--destructive) 18%,transparent); color:var(--destructive); }
  .busy { opacity:.5; }
</style></head>
<body class="dark">
<div class="row"><div class="lbl">Default</div><div class="specimens">
  <section class="dialog" role="alertdialog" aria-labelledby="disconnect-title">
    <div class="content"><h2 id="disconnect-title">Disconnect DESKTOP-RIVER?</h2><p>Any active work on this computer will end. Your conversations stay here, and you can pair it again later.</p></div>
    <div class="footer"><button>Keep connected</button><button class="danger">Disconnect</button></div>
  </section>
</div></div>
<div class="row"><div class="lbl">Pending</div><div class="specimens">
  <section class="dialog busy" aria-label="Disconnecting"><div class="content"><h2>Disconnecting DESKTOP-RIVER…</h2><p>The confirmation remains in place until the server finishes revoking access.</p></div></section>
</div></div>
</body></html>
