# What Coolify deploys.
#
# Three services from one commit: the database migration runs and exits, then
# the API server starts, and the web app is served alongside it. Postgres is NOT
# here — it is a separate Coolify resource, because a database should not be
# torn down and rebuilt every time the application is redeployed.
#
# Deployed as a Coolify "Docker Compose" resource pointed at this repository.
# See docs/runbooks/deploy.md for what has to be set, and in what order.
#
# This file is PRODUCTION. Local Postgres is compose.dev.yaml, named rather than
# found: two files both called docker-compose made `docker compose up` resolve by
# a precedence rule that is the opposite of what it looks like.

services:
  # -------------------------------------------------------------------------
  # migrate — runs once per deploy, then exits
  # -------------------------------------------------------------------------
  # Ahead of the server rather than inside it: a server that migrates on startup
  # runs the migration again on every restart and every replica, and a failed
  # migration then looks like a crash loop rather than like a failed migration.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.server
      target: migrations
    environment:
      # Keep the Compose required-value message empty. Coolify v4.3.18 treats
      # text after `:?` as the generated variable's value, so a helpful prompt
      # here is passed to the container as though it were the database URL.
      - DATABASE_URL=${DATABASE_URL:?}
    # It is meant to exit. Without this Coolify restarts it forever, and the
    # deploy never settles.
    restart: "no"

  # -------------------------------------------------------------------------
  # server — the Go API
  # -------------------------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      target: server
    # Private container port for Coolify's proxy. `expose` documents it to
    # Compose/Coolify without publishing a host port or bypassing the proxy.
    expose:
      - "8080"
    environment:
      - DATABASE_URL=${DATABASE_URL:?}
      # Required, and the server refuses to start without it (docs/Decisions.md
      # D-027). The `:?` makes the deploy fail here, with the variable named,
      # rather than in a container restart loop.
      #
      # DAEMON_TOKEN used to sit beside it. It is gone from deployments (D-038):
      # a computer authenticates with the credential it was paired with, so the
      # shared token had no legitimate user here — only somebody who should not
      # have had it. It lives on for development, where the Makefile and
      # scripts/dev.ps1 set it.
      # The exact origin the browser loads the app from. Anything else is
      # refused CORS and refused a websocket.
      - WEB_ORIGIN=${WEB_ORIGIN:?}
      # The account this deployment belongs to. It registers at /register like
      # anyone else, is told about access requests, and the machine presenting
      # DAEMON_TOKEN works for it (docs/Decisions.md D-031, D-032).
      - OWNER_EMAIL=${OWNER_EMAIL:?}
      # Everyone else allowed to create an account, comma-separated. May be
      # empty: then only the owner can register, and others become requests.
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      # Confirmation and reset links are emailed. `log` is refused here because
      # SESSION_SECURE is true; it exists only for development machines.
      - MAIL_TRANSPORT=smtp
      - SMTP_HOST=${SMTP_HOST:?}
      - SMTP_PORT=${SMTP_PORT:?}
      - SMTP_USERNAME=${SMTP_USERNAME:?}
      - SMTP_PASSWORD=${SMTP_PASSWORD:?}
      # The sender people see, e.g. sparstrowgen <agent@sparstrow.com> — the
      # same mailbox as OWNER_EMAIL; no separate sending mailbox is needed.
      - MAIL_FROM=${MAIL_FROM:?}
      # Not "false", so the session cookie is Secure and wears the __Host-
      # prefix. Never set this to false on a deployed instance.
      - SESSION_SECURE=true
      - ADDR=0.0.0.0:8080
      # Coolify's convention for "expose this service, on this port". It is an
      # ENVIRONMENT VARIABLE, not a label — as a label it is inert and no route
      # is created, which is a failure that looks like the app being down.
      # Empty value: the domain itself is set in the Coolify UI
      # (https://api.sparstrow.com), and a value here would be a URL path.
      - SERVICE_FQDN_SERVER_8080=
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The one endpoint that needs no session. It reports liveness only and
      # deliberately says nothing about whether the owner's machine is
      # connected.
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # web — the Next.js app
  # -------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # BUILD time, not runtime: NEXT_PUBLIC_* is substituted into the client
        # bundle during the build. Changing it requires a rebuild, not a
        # restart — which is why it is an argument here and not an environment
        # variable below.
        NEXT_PUBLIC_API_URL: ${API_ORIGIN:?}
    # As above: private proxy target, not a public host port.
    expose:
      - "3000"
    environment:
      # As above: an environment variable, not a label. Domain set in the UI
      # (https://app.sparstrow.com).
      - SERVICE_FQDN_WEB_3000=
    depends_on:
      - server
    restart: unless-stopped
