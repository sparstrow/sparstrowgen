<!doctype html>
<html lang="en" data-surface="mono" data-accent="neutral" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raw exchange (prototype)</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  :root { --r-md: calc(var(--radius) - 2px); --r-lg: var(--radius); --r-xl: calc(var(--radius) + 4px);
          --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
          --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: 14px; line-height: 20px; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; border-radius: 4px; }
  .ic { flex: none; }

  /* Prototype controls: not part of the design. */
  .proto-bar { position: sticky; top: 0; z-index: 5; height: 40px; display: flex; align-items: center; gap: 18px; padding: 0 12px; border-bottom: 1px dashed var(--border); background: var(--muted); font-size: 12px; overflow-x: auto; white-space: nowrap; }
  .proto-bar .grp { display: flex; align-items: center; gap: 4px; }
  .proto-bar b { font-weight: 500; color: var(--muted-foreground); margin-right: 4px; }
  .proto-bar button { padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--background); }
  .proto-bar button[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }

  /* The Raw view as it is today: monospace, the transcript column, meta lines
     in 12px muted, bodies at 13px exactly as stored. */
  .col { max-width: 48rem; margin: 0 auto; padding: 32px 24px 96px; display: flex; flex-direction: column; gap: 24px; font-family: var(--font-mono); }
  .line { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; margin-bottom: 4px; font-size: 12px; line-height: 16px; color: var(--muted-foreground); }
  .fg { color: var(--foreground); }
  .body { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-mono); font-size: 13px; line-height: 1.625; }
  .p-claude { color: var(--provider-claude); } .p-codex { color: var(--provider-codex); } .p-agy { color: var(--provider-agy); }

  /* The disclosure: one quiet line between a turn's header and its saved
     answer, the same place the activity line sits in the rendered view. */
  .xtoggle { display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 8px -6px; padding: 2px 6px; border-radius: var(--r-md); font-size: 12px; line-height: 16px; color: var(--muted-foreground); transition: background-color 150ms ease-out, color 150ms ease-out; }
  .xtoggle:hover { background: var(--accent); color: var(--foreground); }
  .xtoggle .chev { transition: transform 180ms cubic-bezier(0.25, 1, 0.5, 1); }
  .xtoggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .xnote { margin: 2px 0 8px; font-size: 12px; line-height: 16px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: flex-start; }
  .xnote .ic { margin-top: 1px; }

  .xbody { margin: 0 0 12px 1px; padding-left: 16px; border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 20px; }
  .xsec h4 { margin: 0 0 8px; font-family: var(--font-sans); font-size: 13px; line-height: 20px; font-weight: 500; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 8px; }
  .xsec h4 .meta { font-family: var(--font-mono); font-weight: 400; font-size: 12px; color: var(--muted-foreground); letter-spacing: 0; }
  .xsec h4 .right { margin-left: auto; }

  .kv { display: grid; grid-template-columns: 88px minmax(0, 1fr); column-gap: 12px; row-gap: 4px; font-size: 12px; line-height: 18px; }
  .kv dt { color: var(--muted-foreground); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .kv dd .quiet { color: var(--muted-foreground); }

  .box { margin-top: 8px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--card); overflow: hidden; }
  .box .bh { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 10px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); }
  .box pre { margin: 0; padding: 8px 10px; max-height: 360px; overflow: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 19px; white-space: pre-wrap; overflow-wrap: anywhere; }

  /* The two-button view switch, the same pattern as Rendered / Raw. */
  .seg { margin-left: auto; display: flex; gap: 2px; padding: 2px; border-radius: var(--r-md); background: var(--muted); }
  .seg button { padding: 1px 8px; border-radius: 6px; font-size: 12px; line-height: 18px; color: var(--muted-foreground); }
  .seg button[aria-pressed="true"] { background: var(--background); color: var(--foreground); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }
  .btn-sm { padding: 1px 8px; border-radius: 6px; font-size: 12px; line-height: 18px; color: var(--muted-foreground); font-family: var(--font-sans); }
  .btn-sm:hover { background: var(--accent); color: var(--foreground); }

  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { padding: 0 6px; border-radius: 999px; border: 1px solid var(--border); font-size: 11.5px; line-height: 17px; color: var(--muted-foreground); }

  .usage { display: grid; grid-template-columns: max-content max-content; column-gap: 16px; row-gap: 2px; font-size: 12px; line-height: 18px; font-variant-numeric: tabular-nums; }
  .usage .n { text-align: right; }
  .usage .sub { color: var(--muted-foreground); padding-left: 12px; }
  .usage .tot { border-top: 1px solid var(--border); padding-top: 2px; }
  .expl { margin-top: 8px; font-family: var(--font-sans); font-size: 12px; line-height: 18px; color: var(--muted-foreground); max-width: 36rem; }

  /* Received: one row per line the agent printed, in the order it arrived. */
  .rows { display: flex; flex-direction: column; }
  .row { display: grid; grid-template-columns: 52px minmax(0, max-content) minmax(0, 1fr); column-gap: 10px; align-items: baseline; width: 100%; padding: 1px 6px; margin-left: -6px; border-radius: var(--r-md); font-size: 12px; line-height: 20px; }
  .row:hover { background: var(--accent); }
  .row[aria-expanded="true"] { background: var(--muted); }
  .row .t { color: var(--muted-foreground); font-variant-numeric: tabular-nums; text-align: right; }
  .row .k { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 36ch; }
  .row .k .n { color: var(--muted-foreground); }
  .row .v { color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .row .err { font-weight: 500; }
  .inner { margin: 2px 0 6px 62px; }
  .inner .rows { padding-left: 8px; border-left: 1px solid var(--border); }
  .inner .box { margin-top: 2px; }
  .trunc { margin-top: 6px; font-family: var(--font-sans); font-size: 12px; line-height: 18px; display: flex; gap: 6px; align-items: flex-start; }

  .saved { margin: 4px 0 4px; font-size: 12px; line-height: 16px; color: var(--muted-foreground); }

  /* Status: colour, icon and word together (design system, Status). */
  .status { display: inline-flex; align-items: center; gap: 6px; }
  .status[data-tone="warning"] .ic { color: var(--warning); } .status[data-tone="warning"] .w { color: var(--warning-text); }
  .status[data-tone="danger"] .ic { color: var(--destructive); } .status[data-tone="danger"] .w { color: var(--destructive-text); }
  .status[data-tone="neutral"] .ic { color: var(--muted-foreground); }
  .status[data-tone="progress"] .ic { color: var(--info); }
  .status .w.quiet { color: var(--muted-foreground); }

  .sk { background: var(--muted); border-radius: 4px; height: 12px; }
  .skrow { display: grid; grid-template-columns: 52px 140px 1fr; column-gap: 10px; padding: 4px 0; }
  .spin { animation: spin 900ms linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes row-in { from { opacity: 0; } to { opacity: 1; } }
  .row.new { animation: row-in 200ms cubic-bezier(0.22, 1, 0.36, 1) both; }
  @media (prefers-reduced-motion: reduce) { .xtoggle .chev, .row.new, .spin { transition: none; animation: none; } }
</style>
</head>

        h += '<section class="xsec"><h4>Sent to ' + t.provider + '</h4><div class="sk" style="width:90%;margin-bottom:6px"></div><div class="sk" style="width:40%;margin-bottom:6px"></div><div class="sk" style="height:64px;border-radius:8px"></div></section>' +
             '<section class="xsec"><h4>Received</h4>' + [0, 1, 2, 3, 4, 5].map(function () { return '<div class="skrow"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>'; }).join("") + "</section>";
      } else if (opts.error) {
        h += '<div class="xnote" style="font-family:var(--font-sans);font-size:13px;line-height:20px">' + I("octagon-x", 16) + '<span style="color:var(--foreground)"><span style="color:var(--destructive-text);font-weight:500">Could not load this exchange.</span> The server did not answer. The saved answer below is unaffected. <button class="btn-sm" style="border:1px solid var(--border);color:var(--foreground)" data-act="retry">Try again</button></span></div>';
      } else {
        h += sentSection(id, t) + reportSection(t, !opts.running) + receivedSection(id, t, lines, opts);
      }
      h += "</div>";
    }
    if (opts.running) return h + "</article>";
    if (opts.failure) return h + '<p style="margin:4px 0 0;font-size:13px">' + status("danger", "octagon-x", "turn did not finish: " + opts.failure) + "</p></article>";
    return h + (open ? '<div class="saved">saved answer · what Rendered shows</div>' : "") + '<pre class="body">' + esc(t.answer) + "</pre></article>";
  }

  function you(text, time) { return '<div><div class="line"><span class="fg">you</span><span>' + time + '</span></div><pre class="body">' + esc(text) + "</pre></div>"; }
  function replay() { return '<div class="line"><span>switched to</span><span class="p-claude">claude</span><span>Sonnet 4.6</span><span>· replayed 2 messages · 14 tokens</span></div>'; }

  var OLD = { provider: "codex", model: "GPT-5.6 Sol", time: "Yesterday 4:12 PM", usage: "40.1k tokens", answer: "The retry loop in `dial.go` backs off exponentially but every client starts its first retry at exactly one second, so a server restart brings them all back in the same instant." };

  function render() {
    document.documentElement.classList.toggle("dark", S.theme === "dark");
    var h = "";
    if (S.ui === "not-recorded") {
      h = you("Why do all the daemons reconnect at the same moment after a deploy?", "Yesterday 4:11 PM") + turn("o", OLD, { notRecorded: true });
    } else if (S.ui === "never-ran") {
      var NR = { provider: "codex", model: "GPT-5.6 Sol", time: "9:55 PM", usage: "", answer: "",
        sent: { program: "codex", args: ["exec", "--json", "--ignore-user-config", "--skip-git-repo-check", "-m", "gpt-5.6-sol", "resume", "01a08db6-8502-7043-bd0a-e7a491a96c9f", "-"],
          cwd: "D:\\old-checkout\\sparstrowgen", resume: "01a08db6-8502-7043-bd0a-e7a491a96c9f", prompt: "Run the daemon tests again.", stdin: "Run the daemon tests again.", launched: false },
        report: { says: "codex never started, so it reported nothing." } };
      S.open.n = S.open.n !== false;
      h = you("Run the daemon tests again.", "9:55 PM") + turn("n", NR, { lines: [], why: "codex was never started, because the folder D:\\old-checkout\\sparstrowgen does not exist on this computer.", failure: "The folder D:\\old-checkout\\sparstrowgen does not exist on this computer. Choose another folder for this conversation." });
    } else {
      var cOpts = {};
      if (S.ui === "loading") cOpts.loading = true;
      if (S.ui === "error") cOpts.error = true;
      if (S.ui === "running") { cOpts.running = true; cOpts.lines = CL.slice(0, S.live); }
      if (S.ui === "truncated") cOpts.truncated = true;
      h = you("Why do retries need jitter? One line.", "9:48 PM") + turn("a", TURNS.a) + replay() +
          you("Read package.json and show me the name and version fields.", "9:51 PM") + turn("c", TURNS.c, cOpts);
    }
    document.getElementById("col").innerHTML = h;
    bar();
  }

  function bar() {
    function grp(label, key, opts) { return '<span class="grp"><b>' + label + "</b>" + opts.map(function (o) { return '<button data-act="set" data-k="' + key + '" data-v="' + o + '" aria-pressed="' + (S[key] === o) + '">' + o + "</button>"; }).join("") + "</span>"; }
    document.getElementById("bar").innerHTML = '<b style="font-weight:600">Prototype · Raw view</b>' + grp("State", "ui", ["populated", "running", "not-recorded", "never-ran", "truncated", "loading", "error"]) + grp("Theme", "theme", ["dark", "light"]) +
      (S.ui === "running" ? '<span class="grp"><button data-act="replay-run">Replay the running turn</button></span>' : "");
  }

  /* The running turn: claude's real lines, arriving at their own pace. */
  var timer = null;
  function play() {
    clearTimeout(timer); S.live = 0; S.open.c = true; S.ui = "running"; render();
    (function next() {
      if (S.ui !== "running") return;
      if (S.live >= CL.length) { S.ui = "populated"; render(); return; }
      S.live++; render();
      timer = setTimeout(next, S.live < 2 ? 900 : 120);
    })();
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var a = b.dataset.act, id = b.dataset.turn;
    if (a === "set") { S[b.dataset.k] = b.dataset.v; if (b.dataset.k === "ui" && S.ui === "running") return play(); clearTimeout(timer); render(); }
    if (a === "replay-run") play();
    if (a === "toggle") { S.open[id] = !S.open[id]; render(); }
    if (a === "line") { S.line[id] = S.line[id] === b.dataset.key ? null : b.dataset.key; render(); }
    if (a === "sub") { S.line[id + "/sub"] = S.line[id + "/sub"] === b.dataset.key ? null : b.dataset.key; render(); }
    if (a === "stdin") { S.stdin[id] = b.dataset.v; render(); }
    if (a === "fmt") { S.fmt[b.dataset.key] = b.dataset.v; render(); }
    if (a === "retry") { S.ui = "loading"; render(); setTimeout(function () { S.ui = "populated"; render(); }, 900); }
    if (a === "copy") { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy lines"; }, 1200); }
  });

  if (S.ui === "running") play(); else render();
})();
</script>
