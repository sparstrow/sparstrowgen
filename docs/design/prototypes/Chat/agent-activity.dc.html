<!doctype html>
<html lang="en" data-surface="mono" data-accent="neutral" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent activity (prototype)</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  :root { --r-md: calc(var(--radius) - 2px); --r-lg: var(--radius); --r-xl: calc(var(--radius) + 4px); --r-2xl: calc(var(--radius) + 8px);
          --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
          --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: 14px; line-height: 20px; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; border-radius: 4px; }
  .ic { flex: none; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* Prototype controls: not part of the design. */
  .proto-bar { position: sticky; top: 0; z-index: 5; height: 40px; display: flex; align-items: center; gap: 18px; padding: 0 12px; border-bottom: 1px dashed var(--border); background: var(--muted); font-size: 12px; overflow-x: auto; white-space: nowrap; }
  .proto-bar .grp { display: flex; align-items: center; gap: 4px; }
  .proto-bar b { font-weight: 500; color: var(--muted-foreground); margin-right: 4px; }
  .proto-bar button { padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--background); }
  .proto-bar button[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }

  /* The transcript column, as in the app: agent prose at 15px, 48rem wide. */
  .col { max-width: 48rem; margin: 0 auto; padding: 32px 24px 96px; display: flex; flex-direction: column; gap: 32px; }
  .mine { align-self: flex-end; max-width: 80%; }
  .mine .b { background: var(--mine); color: var(--mine-foreground); border-radius: var(--r-2xl); border-bottom-right-radius: var(--r-md); padding: 10px 16px; font-size: 15px; line-height: 24px; }
  .meta { font-size: 12px; line-height: 16px; color: var(--muted-foreground); }
  .mine .meta { text-align: right; margin-top: 4px; padding-right: 4px; }

  .turn-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .pname { font-size: 14px; font-weight: 500; }
  .prose { font-size: 15px; line-height: 24px; }
  .prose p { margin: 0 0 12px; } .prose p:last-child { margin-bottom: 0; }
  .prose code { font-family: var(--font-mono); font-size: 13px; background: var(--muted); padding: 1px 5px; border-radius: 4px; }
  .usage { margin-top: 10px; font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); }

  /* The activity line: the one thing that sits between the header and the
     answer. Folded, it is a single quiet line; the answer is what is read. */
  .act { margin: 2px 0 10px; }
  .act-toggle { display: inline-flex; align-items: center; gap: 6px; margin-left: -6px; padding: 3px 6px; border-radius: var(--r-md); color: var(--muted-foreground); font-size: 13px; line-height: 20px; transition: background-color 150ms ease-out, color 150ms ease-out; }
  .act-toggle:hover { background: var(--accent); color: var(--foreground); }
  .act-toggle .chev { transition: transform 180ms cubic-bezier(0.25, 1, 0.5, 1); }
  .act-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .act-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 180ms cubic-bezier(0.25, 1, 0.5, 1); }
  .act-body[data-open="true"] { grid-template-rows: 1fr; }
  .act-body > div { overflow: hidden; }
  .trail { position: relative; margin: 6px 0 4px 7px; padding-left: 16px; border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }

  .step { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 2px 6px; margin-left: -6px; border-radius: var(--r-md); font-size: 13px; line-height: 20px; color: var(--foreground); width: 100%; }
  button.step:hover { background: var(--accent); }
  button.step[aria-expanded="true"] { background: var(--muted); }
  .step .ic { color: var(--muted-foreground); }
  .step .verb { flex: none; color: var(--muted-foreground); }
  .step .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step .what.mono { font-size: 12.5px; }
  .step .end { margin-left: auto; flex: none; font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); }
  .add { color: var(--success-text); } .del { color: var(--destructive-text); }
  .note { font-size: 13px; line-height: 20px; color: var(--muted-foreground); padding: 2px 0 4px; max-width: 40rem; }

  /* A step's own detail, opened in place under it. */
  .detail { margin: 2px 0 8px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--card); overflow: hidden; }
  .detail .dh { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); }
  .detail pre { margin: 0; padding: 8px 10px; font-family: var(--font-mono); font-size: 12.5px; line-height: 19px; overflow-x: auto; white-space: pre; }
  .detail .ln { display: block; } .detail .ln.a { color: var(--success-text); } .detail .ln.d { color: var(--destructive-text); }
  .detail .plain { padding: 8px 10px; font-size: 13px; color: var(--muted-foreground); }

  /* Status: colour, icon and word together (design system, Status). */
  .status { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .status[data-tone="warning"] .ic { color: var(--warning); } .status[data-tone="warning"] .w { color: var(--warning-text); }
  .status[data-tone="danger"] .ic { color: var(--destructive); }
  .status .w.quiet { color: var(--foreground); }

  /* The working line while a turn runs: the WorkingIndicator, unchanged. */
  .working { display: flex; align-items: center; gap: 10px; }
  .pixel-grid { display: grid; flex-shrink: 0; grid-template-columns: repeat(3, 4px); gap: 1.5px; }
  .pixel-cell { display: block; width: 4px; height: 4px; border-radius: 1px; background: var(--foreground); opacity: 0.15; }
  @keyframes pixel-on { 0% { opacity: 0.15; } 20% { opacity: 1; } 55%, 100% { opacity: 0.15; } }
  .working-shimmer { font-size: 13px; line-height: 20px; font-weight: 500; color: transparent;
    background-image: linear-gradient(90deg, var(--muted-foreground) 35%, var(--foreground) 50%, var(--muted-foreground) 65%);
    background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; animation: working-shimmer 1.4s linear infinite; }
  @keyframes working-shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .spin { animation: spin 900ms linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes step-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .step.new { animation: step-in 200ms cubic-bezier(0.22, 1, 0.36, 1) both; }

  .notice { margin-top: 12px; display: flex; gap: 10px; border: 1px solid color-mix(in oklch, var(--destructive) 40%, transparent); background: color-mix(in oklch, var(--destructive) 8%, transparent); border-radius: var(--r-lg); padding: 10px 12px; font-size: 13px; }
  .notice .t { font-weight: 500; color: var(--destructive-text); }
  .sk { background: var(--muted); border-radius: 6px; }
  .empty { text-align: center; padding: 96px 0; }
  .empty .t { font-weight: 500; font-size: 14px; } .empty .d { color: var(--muted-foreground); max-width: 24rem; margin: 4px auto 0; }

  @media (prefers-reduced-motion: reduce) {
    .pixel-cell { animation: none !important; } .working-shimmer { animation: none; background-image: none; color: var(--muted-foreground); }
    .act-body, .act-toggle .chev, .step.new { transition: none; animation: none; }
    .spin { animation: none; }
  }
</style>
</head>
<body>
<div class="proto-bar" id="bar"></div>
<main class="col" id="col" aria-label="Transcript"></main>

<script src="../icons.js"></script>
<script>
(function () {
  var ICONS = window.SPG_ICONS, MARKS = window.SPG_MARKS;
  var Q = new URLSearchParams(location.search);
  function pick(v, ok, d) { return ok.indexOf(v) > -1 ? v : d; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function I(n, s, cls) {
    s = s || 16;
    var nodes = (ICONS[n] || []).map(function (x) { return "<" + x[0] + " " + Object.keys(x[1]).map(function (k) { return k + '="' + x[1][k] + '"'; }).join(" ") + "/>"; }).join("");
    return '<svg class="ic ' + (cls || "") + '" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + nodes + "</svg>";
  }
  function M(p, s) { return '<svg class="ic" width="' + (s || 16) + '" height="' + (s || 16) + '" viewBox="0 0 24 24" fill="var(--provider-' + p + ')" aria-hidden="true"><path d="' + MARKS[p] + '"/></svg>'; }

  var S = {
    ui: pick(Q.get("state"), ["populated", "running", "empty", "loading", "error"], "populated"),
    theme: pick(Q.get("theme"), ["light", "dark"], "dark"),
    open: {},      // which turns' activity is unfolded
    detail: {},    // which step's detail is open, per turn
    live: 0,       // how many steps of the running turn have arrived
    elapsed: 0,
  };

  /* ── Data, shaped only from what the three CLIs were seen to report on
     2026-09-24 (docs/Capabilities.md, "Agent activity"). Thinking arrives with
     no text, so it is only ever "Thought for 4s". Searches carry a query and no
     sources. Edits carry the old and new text, so their line counts are real. */
  var CLAUDE = { provider: "claude", model: "Sonnet 5", time: "9:04 PM", worked: 37, usage: "31.4k tokens · $0.09",
    steps: [
      { k: "thought", secs: 4 },
      { k: "note", text: "I'll look at the reconnect test first, then at how the daemon waits for the socket." },
      { k: "read", path: "server/cmd/daemon/reconnect_test.go", lines: 118 },
      { k: "grep", pattern: "time.Sleep", where: "server/cmd/daemon", hits: 3 },
      { k: "run", cmd: "go test ./cmd/daemon -run Reconnect -count=20", out: "--- FAIL: TestReconnectAfterServerRestart (0.21s)\n    reconnect_test.go:64: still offline after 200ms\nFAIL\nFAIL\tgithub.com/sparstrow/sparstrowgen/server/cmd/daemon\t4.812s", failed: true },
      { k: "thought", secs: 2 },
      { k: "edit", path: "server/cmd/daemon/reconnect_test.go", add: 4, del: 2,
        diff: [["d", "\ttime.Sleep(200 * time.Millisecond)"], ["d", "\tif !d.online() {"], ["a", "\tselect {"], ["a", "\tcase <-d.Connected():"], ["a", "\tcase <-time.After(2 * time.Second):"], ["a", "\t\tt.Fatal(\"still offline after 2s\")"]] },
      { k: "run", cmd: "go test ./cmd/daemon -run Reconnect -count=20", out: "ok  \tgithub.com/sparstrow/sparstrowgen/server/cmd/daemon\t3.207s" },
      { k: "web", query: "go test flaky websocket reconnect sleep" },
    ],
    answer: '<p>The test slept a fixed 200 ms and then asserted the daemon was back online. On a slow CI runner the reconnect lands later than that, so the assertion ran first.</p><p>It now waits for the <code>Connected</code> event instead, with a two-second ceiling so a real outage still fails fast. Twenty runs in a row pass locally.</p>' };

  var CODEX = { provider: "codex", model: "GPT-5.6 Sol", time: "9:07 PM", worked: 21, usage: "69.9k tokens",
    steps: [
      { k: "web", query: "site:go.dev latest Go release September 2026" },
      { k: "refused", what: "Run a command", why: "Codex is not allowed to run commands on this computer." },
    ],
    answer: "<p>Go 1.27.1 is the latest release. I could not check which version this computer has installed: running <code>go version</code> was not allowed.</p>" };

  var RUN = { provider: "claude", model: "Sonnet 5", time: "9:09 PM",
    steps: [
      { k: "thought", secs: 3 },
      { k: "read", path: "apps/web/components/chat/composer.tsx", lines: 276 },
      { k: "grep", pattern: "disabledReason", where: "apps/web", hits: 4 },
      { k: "edit", path: "apps/web/components/chat/composer.tsx", add: 6, del: 1, diff: [["d", '  {pending && ('], ["a", '  {pending && pending.messagesToReplay > 0 && (']] },
      { k: "run", cmd: "pnpm --filter web exec tsc --noEmit", out: "" },
    ],
    answer: "<p>The notice now only appears when switching replays something. The typecheck passes.</p>" };

  /* ── One step, as a row. Verb first in the muted colour, the object after it
     in the foreground: the object is what a person scans for. */
  function stepRow(turnId, s, i, opts) {
    opts = opts || {};
    var id = turnId + ":" + i, isOpen = S.detail[turnId] === i, cls = "step" + (opts.fresh ? " new" : "");
    var lead = opts.active ? I("loader-circle", 14, "spin") : null;
    if (s.k === "note") return '<div class="note' + (opts.fresh ? " step new" : "") + '" style="' + (opts.fresh ? "min-height:0;padding:2px 0 4px;margin:0" : "") + '">' + esc(s.text) + "</div>";
    if (s.k === "refused") return '<div class="' + cls + '"><span class="status" data-tone="warning">' + I("triangle-alert", 14) + '<span class="w">Not allowed</span></span><span class="what">' + esc(s.why) + "</span></div>";
    var icon, verb, what, end = "", mono = false, openable = true;
    if (s.k === "thought") { icon = "brain"; verb = opts.active ? "Thinking" : "Thought"; what = opts.active ? "" : "for " + s.secs + "s"; openable = false; }
    if (s.k === "read") { icon = "file-text"; verb = "Read"; what = s.path; mono = true; end = s.lines + " lines"; }
    if (s.k === "grep") { icon = "search"; verb = "Searched"; what = s.pattern + "  in " + s.where; mono = true; end = s.hits + " matches"; }
    if (s.k === "edit") { icon = "file-pen"; verb = "Edited"; what = s.path; mono = true; end = '<span class="add">+' + s.add + '</span> <span class="del">−' + s.del + "</span>"; }
    if (s.k === "run") { icon = "square-terminal"; verb = "Ran"; what = s.cmd; mono = true; end = s.failed ? '<span class="del">exit 1</span>' : ""; }
    if (s.k === "web") { icon = "search"; verb = "Searched the web"; what = "“" + s.query + "”"; openable = false; }
    var inner = (lead || I(icon, 14)) + '<span class="verb">' + verb + '</span><span class="what' + (mono ? " mono" : "") + '" title="' + esc(what) + '">' + esc(what) + "</span>" + (end ? '<span class="end">' + end + "</span>" : "");
    var row = openable && !opts.active
      ? '<button class="' + cls + '" data-act="detail" data-turn="' + turnId + '" data-i="' + i + '" aria-expanded="' + isOpen + '">' + inner + "</button>"
      : '<div class="' + cls + '">' + inner + "</div>";
    return row + (isOpen ? detail(s) : "");
  }

  function detail(s) {
    if (s.k === "edit") return '<div class="detail"><div class="dh">' + I("file-pen", 12) + esc(s.path) + "</div><pre>" + s.diff.map(function (l) { return '<span class="ln ' + l[0] + '">' + (l[0] === "a" ? "+ " : "- ") + esc(l[1]) + "</span>"; }).join("") + "</pre></div>";
    if (s.k === "run") return '<div class="detail"><div class="dh">' + I("square-terminal", 12) + esc(s.cmd) + "</div>" + (s.out ? "<pre>" + esc(s.out) + "</pre>" : '<div class="plain">No output.</div>') + "</div>";
    if (s.k === "read") return '<div class="detail"><div class="dh">' + I("file-text", 12) + esc(s.path) + '</div><div class="plain">Read all ' + s.lines + " lines. The contents are not kept here; the file is on your computer.</div></div>";
    if (s.k === "grep") return '<div class="detail"><div class="dh">' + I("search", 12) + esc(s.pattern) + '</div><div class="plain">' + s.hits + " matches in " + esc(s.where) + ".</div></div>";
    return "";
  }

  function header(t) {
    return '<div class="turn-head">' + M(t.provider) + '<span class="pname" style="color:var(--provider-' + t.provider + ')">' + t.provider + '</span><span class="meta">' + esc(t.model) + " · " + t.time + "</span></div>";
  }

  /* ── A finished turn: one folded line, then the answer. */
  function doneTurn(id, t, extra) {
    var open = !!S.open[id];
    var count = t.steps.filter(function (s) { return s.k !== "note" && s.k !== "thought"; }).length;
    var act = t.steps.length === 0 ? "" :
      '<div class="act"><button class="act-toggle" data-act="toggle" data-turn="' + id + '" aria-expanded="' + open + '" aria-controls="act-' + id + '">' +
        '<span>Worked for ' + fmt(t.worked) + '</span>' + I("chevron-down", 14, "chev") + "</button>" +
        '<div class="act-body" id="act-' + id + '" data-open="' + open + '"><div><div class="trail" aria-label="' + count + ' steps">' +
          t.steps.map(function (s, i) { return stepRow(id, s, i); }).join("") +
        "</div></div></div></div>";
    return "<article>" + header(t) + act + '<div class="prose">' + t.answer + "</div>" + (extra || "") + '<div class="usage">' + t.usage + "</div></article>";
  }

  /* ── The running turn: the working line is the header of the activity, and
     the trail is open while it grows — this is the part worth watching. */
  function runningTurn() {
    var t = RUN, shown = t.steps.slice(0, S.live);
    var rows = shown.map(function (s, i) { return stepRow("run", s, i, { active: i === shown.length - 1 && S.live <= t.steps.length, fresh: i === shown.length - 1 }); }).join("");
    return "<article>" + header(t) +
      '<div class="act"><div class="working" role="status" aria-live="polite">' + grid() + '<span class="working-shimmer">working</span><span class="mono meta" aria-hidden="true">' + S.elapsed.toFixed(1) + "s</span></div>" +
      (rows ? '<div class="trail">' + rows + "</div>" : "") + "</div></article>";
  }
  function grid() {
    var d = []; for (var i = 0; i < 9; i++) { var r = Math.floor(i / 3), c = i % 3; d.push((c + Math.abs(r - 1)) * 90); }
    return '<span class="pixel-grid" aria-hidden="true">' + d.map(function (x) { return '<span class="pixel-cell" style="animation:pixel-on 650ms ease-in-out ' + x + 'ms infinite"></span>'; }).join("") + "</span>";
  }
  function fmt(s) { return s < 60 ? s + "s" : Math.floor(s / 60) + "m " + (s % 60) + "s"; }

  function mine(text, time) { return '<div class="mine"><div class="b">' + esc(text) + '</div><div class="meta">' + time + "</div></div>"; }

  function render() {
    document.documentElement.classList.toggle("dark", S.theme === "dark");
    var col = document.getElementById("col"), h = "";
    if (S.ui === "loading") {
      h = '<div class="mine" style="width:40%"><div class="sk" style="height:44px;border-radius:16px"></div></div>' +
          '<div><div class="sk" style="height:14px;width:140px;margin-bottom:10px"></div><div class="sk" style="height:14px;width:110px;margin-bottom:14px"></div><div class="sk" style="height:16px;width:100%;margin-bottom:8px"></div><div class="sk" style="height:16px;width:80%"></div></div>';
    } else if (S.ui === "empty") {
      // A turn that did nothing but answer has no activity line at all — not
      // "Worked for 0s", which would say something happened.
      h = mine("What does D-051 say about computers in a workspace?", "9:12 PM") +
          doneTurn("e", { provider: "claude", model: "Haiku 4.5", time: "9:12 PM", worked: 0, usage: "2.1k tokens · $0.01", steps: [],
            answer: "<p>A computer is offered to workspaces, and that assignment is what routes the work: a workspace runs only on the computers it was given.</p>" });
    } else if (S.ui === "error") {
      var t = { provider: "claude", model: "Sonnet 5", time: "9:15 PM", worked: 12, usage: "8.2k tokens · $0.03",
        steps: CLAUDE.steps.slice(0, 5), answer: "<p>The reconnect test waits a fixed 200 ms, and on CI that is not long enough. I was about to</p>" };
      h = mine("The reconnect test is flaky on CI. Find out why and fix it.", "9:15 PM") +
          doneTurn("x", t, '<div class="notice">' + I("octagon-x", 16) + '<div><div class="t">Turn did not finish</div><div>claude closed the connection before finishing (exit code 1). What it did and wrote before that is kept above.</div></div></div>');
    } else {
      h = mine("The reconnect test is flaky on CI. Find out why and fix it.", "9:04 PM") + doneTurn("a", CLAUDE) +
          mine("And what is the latest Go release? Is it the one installed here?", "9:07 PM") + doneTurn("b", CODEX);
      if (S.ui === "running") h += mine("Only show the switch notice when it costs something.", "9:09 PM") + runningTurn();
    }
    col.innerHTML = h;
    bar();
  }

  function bar() {
    function grp(label, key, opts) { return '<span class="grp"><b>' + label + "</b>" + opts.map(function (o) { return '<button data-act="set" data-k="' + key + '" data-v="' + o + '" aria-pressed="' + (S[key] === o) + '">' + o + "</button>"; }).join("") + "</span>"; }
    document.getElementById("bar").innerHTML = '<b style="font-weight:600">Prototype</b>' + grp("State", "ui", ["populated", "running", "empty", "loading", "error"]) + grp("Theme", "theme", ["dark", "light"]) +
      (S.ui === "running" ? '<span class="grp"><button data-act="replay">Replay the running turn</button></span>' : "");
  }

  /* The running turn, simulated: a step arrives every ~1.4s, then the turn
     ends — the trail folds away and the answer takes its place. */
  var timer = null, clock = null;
  function play() {
    clearInterval(timer); clearInterval(clock);
    S.live = 0; S.elapsed = 0; delete S.open.r;
    clock = setInterval(function () { S.elapsed += 0.1; var el = document.querySelector(".working .mono"); if (el) el.textContent = S.elapsed.toFixed(1) + "s"; }, 100);
    timer = setInterval(function () {
      S.live++;
      if (S.live > RUN.steps.length) {
        clearInterval(timer); clearInterval(clock);
        // Settled: exactly what a finished turn looks like, so nothing jumps
        // when you scroll back to it later.
        RUN.worked = Math.round(S.elapsed); RUN.usage = "18.6k tokens · $0.05";
        S.ui = "populated-with-run";
        document.getElementById("col").insertAdjacentHTML("beforeend", "");
        var col = document.getElementById("col");
        col.lastElementChild.outerHTML = doneTurn("r", RUN);
        S.ui = "running";
        return;
      }
      render();
    }, 1400);
    render();
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var a = b.dataset.act;
    if (a === "set") { S[b.dataset.k] = b.dataset.v; if (b.dataset.k === "ui") { if (S.ui === "running") return play(); clearInterval(timer); clearInterval(clock); } render(); }
    if (a === "replay") play();
    if (a === "toggle") { var id = b.dataset.turn; S.open[id] = !S.open[id]; rerenderTurn(id); }
    if (a === "detail") { var t = b.dataset.turn, i = +b.dataset.i; S.detail[t] = S.detail[t] === i ? undefined : i; rerenderTurn(t); }
  });
  function rerenderTurn(id) {
    var btn = document.querySelector('[data-act="toggle"][data-turn="' + id + '"]');
    var art = btn ? btn.closest("article") : document.querySelector('[data-turn="' + id + '"]').closest("article");
    var t = { a: CLAUDE, b: CODEX, r: RUN, x: null }[id];
    if (!t) return render();
    var tmp = document.createElement("div"); tmp.innerHTML = doneTurn(id, t);
    art.replaceWith(tmp.firstElementChild);
  }

  if (S.ui === "running") play(); else render();
})();
</script>
