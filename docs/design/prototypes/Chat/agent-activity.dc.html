<!doctype html>
<html lang="en" data-surface="mono" data-accent="neutral" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent activity (prototype)</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  :root { --r-md: calc(var(--radius) - 2px); --r-lg: var(--radius); --r-xl: calc(var(--radius) + 4px); --r-2xl: calc(var(--radius) + 8px);
          --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
          --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: 14px; line-height: 20px; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; border-radius: 4px; }
  .ic { flex: none; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Prototype controls: not part of the design. */
  .proto-bar { height: 40px; display: flex; align-items: center; gap: 18px; padding: 0 12px; border-bottom: 1px dashed var(--border); background: var(--muted); font-size: 12px; overflow-x: auto; white-space: nowrap; }
  .proto-bar .grp { display: flex; align-items: center; gap: 4px; }
  .proto-bar b { font-weight: 500; color: var(--muted-foreground); margin-right: 4px; }
  .proto-bar button { padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--background); }
  .proto-bar button[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }

  /* The conversation and, beside it, the Changes pane. */
  .app { display: flex; height: calc(100vh - 40px); }
  .chat { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .app[data-max="true"] .chat { display: none; }
  .ch { flex: none; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--border); }
  .ch .ttl { min-width: 0; flex: 1; }
  .ch .ttl .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch .ttl .f { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: var(--muted-foreground); }
  .toggle2 { display: inline-flex; padding: 2px; border-radius: var(--r-md); background: var(--muted); font-size: 12px; }
  .toggle2 span { padding: 2px 8px; border-radius: 6px; color: var(--muted-foreground); }
  .toggle2 span.on { background: var(--background); color: var(--foreground); }
  .hbtn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: var(--r-md); border: 1px solid var(--border); font-size: 13px; transition: background-color 150ms ease-out; }
  .hbtn:hover { background: var(--accent); }
  .hbtn[aria-pressed="true"] { background: var(--muted); }
  .hbtn .cnt { font-family: var(--font-mono); font-size: 12px; }
  .hbtn .lbl { color: var(--foreground); }
  .ibtn { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: var(--r-md); color: var(--muted-foreground); transition: background-color 150ms ease-out, color 150ms ease-out; }
  .ibtn:hover { background: var(--accent); color: var(--foreground); }
  .ibtn[aria-pressed="true"] { color: var(--foreground); background: var(--muted); }
  .scroll { flex: 1; overflow-y: auto; }

  /* The transcript column, as in the app: agent prose at 15px, 48rem wide. */
  .col { max-width: 48rem; margin: 0 auto; padding: 32px 24px 96px; display: flex; flex-direction: column; gap: 32px; }
  .mine { align-self: flex-end; max-width: 80%; }
  .mine .b { background: var(--mine); color: var(--mine-foreground); border-radius: var(--r-2xl); border-bottom-right-radius: var(--r-md); padding: 10px 16px; font-size: 15px; line-height: 24px; }
  .meta { font-size: 12px; line-height: 16px; color: var(--muted-foreground); }
  .mine .meta { text-align: right; margin-top: 4px; padding-right: 4px; }

  .turn-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .pname { font-size: 14px; font-weight: 500; }
  .prose { font-size: 15px; line-height: 24px; }
  .prose p { margin: 0 0 12px; } .prose p:last-child { margin-bottom: 0; }
  .prose code { font-family: var(--font-mono); font-size: 13px; background: var(--muted); padding: 1px 5px; border-radius: 4px; }
  .usage { margin-top: 10px; font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); }

  /* The activity line: the one thing that sits between the header and the
     answer. Folded, it is a single quiet line; the answer is what is read. */
  .act { margin: 2px 0 10px; }
  .act-toggle { display: inline-flex; align-items: center; gap: 6px; margin-left: -6px; padding: 3px 6px; border-radius: var(--r-md); color: var(--muted-foreground); font-size: 13px; line-height: 20px; transition: background-color 150ms ease-out, color 150ms ease-out; }
  .act-toggle:hover { background: var(--accent); color: var(--foreground); }
  .act-toggle .chev { transition: transform 180ms cubic-bezier(0.25, 1, 0.5, 1); }
  .act-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .act-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 180ms cubic-bezier(0.25, 1, 0.5, 1); }
  .act-body[data-open="true"] { grid-template-rows: 1fr; }
  .act-body > div { overflow: hidden; }
  .trail { position: relative; margin: 6px 0 4px 7px; padding-left: 16px; border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }

  .step { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 2px 6px; margin-left: -6px; border-radius: var(--r-md); font-size: 13px; line-height: 20px; color: var(--foreground); width: 100%; }
  button.step:hover { background: var(--accent); }
  button.step[aria-expanded="true"] { background: var(--muted); }
  .step .ic { color: var(--muted-foreground); }
  .step .verb { flex: none; color: var(--muted-foreground); }
  .step .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step .what.mono { font-size: 12.5px; }
  .step .end { margin-left: auto; flex: none; font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); }
  .add { color: var(--success-text); } .del { color: var(--destructive-text); }
  .note { font-size: 13px; line-height: 20px; color: var(--muted-foreground); padding: 2px 0 4px; max-width: 40rem; }

  /* A step's own detail, opened in place under it. */
  .detail { margin: 2px 0 8px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--card); overflow: hidden; }
  .detail .dh { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); }
  .detail pre { margin: 0; padding: 8px 10px; font-family: var(--font-mono); font-size: 12.5px; line-height: 19px; overflow-x: auto; white-space: pre; }
  .detail .plain { padding: 8px 10px; font-size: 13px; color: var(--muted-foreground); }
  .step-diff { margin: 2px 0 8px; }

  /* ── The diff card: CodeBlock's Diff view. One number gutter (old number on
     a removed line, new number otherwise), a tinted row and a 3px bar — solid
     for an added line, hatched for a removed one, so the two differ without
     colour — and the changed words inside a changed line marked again. */
  .dc { border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--card); overflow: clip; }
  .dc-h { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 6px 0 10px; font-size: 12.5px; background: var(--card); }
  .dc[data-open="true"] .dc-h { border-bottom: 1px solid var(--border); }
  .dc-h .fold { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; align-self: stretch; }
  .dc-h .fold .chev { color: var(--muted-foreground); transition: transform 180ms cubic-bezier(0.25, 1, 0.5, 1); transform: rotate(-90deg); }
  .dc[data-open="true"] .dc-h .fold .chev { transform: none; }
  .dc-h .path { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); direction: rtl; text-align: left; }
  .dc-h .path bdi { direction: ltr; }
  .dc-h .dir { color: var(--muted-foreground); }
  .dc-h .kind { flex: none; font-size: 12px; color: var(--muted-foreground); }
  .dc-h .stat { flex: none; margin-left: auto; font-family: var(--font-mono); font-size: 12px; display: inline-flex; gap: 8px; padding-right: 4px; }
  .dc-b { padding: 6px 0; font-family: var(--font-mono); font-size: 12.5px; line-height: 20px; tab-size: 4; background: color-mix(in oklch, var(--background) 60%, transparent); }
  .dr { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr); }
  .dr .g { user-select: none; text-align: right; padding-right: 10px; font-size: 11px; color: var(--muted-foreground); border-right: 1px solid var(--border); }
  .dr code { font: inherit; padding: 0 12px 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--foreground); }
  .dr.a { background: color-mix(in oklch, var(--success) 12%, transparent); }
  .dr.d { background: color-mix(in oklch, var(--destructive) 12%, transparent); }
  .dr.a .g { color: var(--success-text); } .dr.d .g { color: var(--destructive-text); }
  .dr.a::before, .dr.d::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; }
  .dr.a::before { background: var(--success); }
  .dr.d::before { background: repeating-linear-gradient(45deg, var(--destructive) 0 1.5px, transparent 1.5px 3px); }
  .wa, .wd { border-radius: 3px; padding: 0 1px; margin: 0 -1px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .wa { background: color-mix(in oklch, var(--success) 32%, transparent); }
  .wd { background: color-mix(in oklch, var(--destructive) 32%, transparent); }
  .gap { display: grid; grid-template-columns: 44px minmax(0, 1fr); color: var(--muted-foreground); font-family: var(--font-sans); font-size: 12px; }
  .gap .g { border-right: 1px solid var(--border); }
  .gap span:last-child { padding: 2px 10px; }
  .dc-more { display: block; width: 100%; padding: 6px 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); text-align: left; transition: background-color 150ms ease-out, color 150ms ease-out; }
  .dc-more:hover { background: var(--accent); color: var(--foreground); }
  .tok-kw { color: var(--code-keyword); } .tok-str { color: var(--code-string); } .tok-num { color: var(--code-number); }
  .tok-com { color: var(--code-comment); font-style: italic; } .tok-fn { color: var(--code-function); } .tok-type { color: var(--code-type); }

  /* What a finished turn changed: under the answer, above the usage line. */
  .changes { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .changes-h { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted-foreground); }
  .changes-h .stat { font-family: var(--font-mono); font-size: 12px; display: inline-flex; gap: 6px; }
  .changes-h .open { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: var(--r-md); font-size: 12.5px; color: var(--muted-foreground); }
  .changes-h .open:hover { background: var(--accent); color: var(--foreground); }

  /* ── The Changes pane. */
  .pane { flex: 0 0 54%; max-width: 920px; min-width: 460px; border-left: 1px solid var(--border); display: flex; flex-direction: column; background: var(--background); }
  .app[data-max="true"] .pane { flex-basis: 100%; max-width: none; border-left: 0; }
  .ph { flex: none; height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; border-bottom: 1px solid var(--border); }
  .ph .t { font-weight: 500; }
  .ph .scope { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted-foreground); font-size: 13px; }
  .ph .stat { flex: none; font-family: var(--font-mono); font-size: 12px; display: inline-flex; gap: 6px; }
  .ph .sp { flex: 1; }
  .pb { flex: 1; display: flex; min-height: 0; position: relative; }
  .files { flex: none; width: 260px; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; background: var(--background); }
  .tree { flex: 1; overflow-y: auto; padding: 8px; }
  .dirrow { display: flex; align-items: center; gap: 6px; padding: 4px 6px; font-size: 12px; color: var(--muted-foreground); font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frow { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px; padding: 2px 6px 2px 18px; border-radius: var(--r-md); font-size: 13px; transition: background-color 150ms ease-out; }
  .frow:hover { background: var(--accent); }
  .frow[aria-current="true"] { background: var(--muted); }
  .frow .ic { color: var(--muted-foreground); }
  .frow .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: 12.5px; }
  .frow .nm.gone { text-decoration: line-through; color: var(--muted-foreground); }
  .frow .stat { margin-left: auto; flex: none; font-family: var(--font-mono); font-size: 11.5px; display: inline-flex; gap: 6px; }
  .scopes { flex: none; max-height: 45%; overflow-y: auto; border-top: 1px solid var(--border); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .srow { display: flex; align-items: flex-start; gap: 8px; width: 100%; padding: 6px 8px; border-radius: var(--r-md); transition: background-color 150ms ease-out; }
  .srow:hover { background: var(--accent); }
  .srow[aria-current="true"] { background: var(--muted); }
  .srow .body { min-width: 0; flex: 1; }
  .srow .a { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow .b { font-size: 12px; line-height: 16px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; }
  .srow .b .stat { font-family: var(--font-mono); display: inline-flex; gap: 6px; margin-left: auto; }
  .srow .ic { margin-top: 2px; color: var(--muted-foreground); }
  .diffs { flex: 1; min-width: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .diffs .dc-h { position: sticky; top: -12px; z-index: 1; }
  .pstate { margin: auto; text-align: center; max-width: 26rem; padding: 32px 16px; }
  .pstate .ic { color: var(--muted-foreground); }
  .pstate .t { font-weight: 500; margin-top: 10px; } .pstate .d { color: var(--muted-foreground); margin-top: 4px; font-size: 13px; }
  .pstate .btn { margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--r-md); }
  .pstate .btn:hover { background: var(--accent); }

  /* Status: colour, icon and word together (design system, Status). */
  .status { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .status[data-tone="warning"] .ic { color: var(--warning); } .status[data-tone="warning"] .w { color: var(--warning-text); }
  .status[data-tone="danger"] .ic { color: var(--destructive); } .status[data-tone="danger"] .w { color: var(--destructive-text); }
  .status[data-tone="progress"] .ic { color: var(--info); }

  /* The working line while a turn runs: the WorkingIndicator, unchanged. */
  .working { display: flex; align-items: center; gap: 10px; }
  .pixel-grid { display: grid; flex-shrink: 0; grid-template-columns: repeat(3, 4px); gap: 1.5px; }
  .pixel-cell { display: block; width: 4px; height: 4px; border-radius: 1px; background: var(--foreground); opacity: 0.15; }
  @keyframes pixel-on { 0% { opacity: 0.15; } 20% { opacity: 1; } 55%, 100% { opacity: 0.15; } }
  .working-shimmer { font-size: 13px; line-height: 20px; font-weight: 500; color: transparent;
    background-image: linear-gradient(90deg, var(--muted-foreground) 35%, var(--foreground) 50%, var(--muted-foreground) 65%);
    background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; animation: working-shimmer 1.4s linear infinite; }
  @keyframes working-shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .spin { animation: spin 900ms linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes step-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .step.new { animation: step-in 200ms cubic-bezier(0.22, 1, 0.36, 1) both; }

  .notice { margin-top: 12px; display: flex; gap: 10px; border: 1px solid color-mix(in oklch, var(--destructive) 40%, transparent); background: color-mix(in oklch, var(--destructive) 8%, transparent); border-radius: var(--r-lg); padding: 10px 12px; font-size: 13px; }
  .notice .t { font-weight: 500; color: var(--destructive-text); }
  .sk { background: var(--muted); border-radius: 6px; }

  /* Narrow: the pane covers the conversation instead of sharing the width,
     and its file list becomes something you open. */
  @media (max-width: 960px) {
    .pane { position: fixed; inset: 40px 0 0 0; min-width: 0; max-width: none; z-index: 4; border-left: 0; }
    .files { position: absolute; inset: 0 auto 0 0; z-index: 2; box-shadow: 0 0 0 100vmax color-mix(in oklch, var(--background) 60%, transparent); }
    .hbtn .lbl { display: none; }
    .ch .toggle2 { display: none; }
  }
  @media (max-width: 480px) { .files { width: 100%; box-shadow: none; } .hbtn .cnt { display: none; } }

  @media (prefers-reduced-motion: reduce) {
    .pixel-cell { animation: none !important; } .working-shimmer { animation: none; background-image: none; color: var(--muted-foreground); }
    .act-body, .act-toggle .chev, .step.new, .dc-h .fold .chev { transition: none; animation: none; }
    .spin { animation: none; }
  }
</style>
</head>

<div class="proto-bar" id="bar"></div>
<div class="app" id="app"></div>

<script src="../icons.js"></script>
<script>
(function () {

  function pick(v, ok, d) { return ok.indexOf(v) > -1 ? v : d; }

    return '<svg class="ic ' + (cls || "") + '" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + nodes + "</svg>";
  }
  function M(p, s) { return '<svg class="ic" width="' + (s || 16) + '" height="' + (s || 16) + '" viewBox="0 0 24 24" fill="var(--provider-' + p + ')" aria-hidden="true"><path d="' + MARKS[p] + '"/></svg>'; }
  var narrow = matchMedia("(max-width: 960px)").matches;

  var S = {
    ui: pick(Q.get("state"), ["populated", "running", "empty", "loading", "error"], "populated"),
    theme: pick(Q.get("theme"), ["light", "dark"], "dark"),

    paneData: pick(Q.get("changes"), ["recorded", "loading", "error", "not-recorded"], "recorded"),
    scope: "all",     // "all" or a turn id
    max: false,       // the pane covers the conversation
    files: !narrow,   // the pane's file list is shown
    focus: null,      // a path to scroll the pane to
    open: {},         // which turns' activity is unfolded
    detail: {},       // which step's detail is open, per turn
    fold: {},         // diff cards folded by hand, per place
    full: {},         // diff cards showing every line, per place
    live: 0, elapsed: 0, runDone: false,
  };

  /* ── Changed files. Shaped like a unified diff's hunks, because that is what
     the daemon can produce for any agent: it snapshots the conversation's folder
     before and after each step (docs/Capabilities.md, "What a turn changed"). */
  var DAEMON_GO = { path: "server/cmd/daemon/daemon.go", lang: "go", kind: "M", hunks: [
    { o: 86, n: 86, rows: [[" ", "type Daemon struct {"], [" ", "\tmu      sync.Mutex"], [" ", "\tonline  bool"],
      ["+", "\t// connected is closed and replaced each time the socket comes up, so a"], ["+", "\t// test can wait for the next connection instead of sleeping."], ["+", "\tconnected chan struct{}"], [" ", "}"]] },
    { o: 139, n: 142, rows: [[" ", "\td.mu.Lock()"], [" ", "\td.online = true"], ["+", "\tclose(d.connected)"], ["+", "\td.connected = make(chan struct{})"], [" ", "\td.mu.Unlock()"]] },
    { o: 158, n: 163, rows: [[" ", "}"], [" ", ""], ["+", "// Connected returns a channel that is closed on the next successful connection."], ["+", "func (d *Daemon) Connected() <-chan struct{} {"], ["+", "\td.mu.Lock()"], ["+", "\tdefer d.mu.Unlock()"], ["+", "\treturn d.connected"], ["+", "}"]] },
  ] };
  var TEST_GO = { path: "server/cmd/daemon/reconnect_test.go", lang: "go", kind: "M", hunks: [
    { o: 56, n: 56, rows: [[" ", "\tsrv.Restart()"], [" ", ""], ["-", "\ttime.Sleep(200 * time.Millisecond)"], ["-", "\tif !d.online() {"], ["-", "\t\tt.Fatal(\"still offline after 200ms\")"],
      ["+", "\tselect {"], ["+", "\tcase <-d.Connected():"], ["+", "\tcase <-time.After(2 * time.Second):"], ["+", "\t\tt.Fatal(\"still offline after 2s\")"], [" ", "\t}"], [" ", "}"]] },

        '<div class="diffs" id="diffs">' + files.map(function (f) { return diffCard(f, "pane:" + S.scope, { full: true, anchor: true }); }).join("") + "</div>";
    }
    return '<aside class="pane" aria-label="Changes">' + head + '<div class="pb">' + body + "</div></aside>";
  }

  /* ── The conversation header: title, folder, the view switch, and the way
     into Changes, which carries the conversation's running total. */
  function chatHeader() {
    var every = allFiles(turnsWithChanges()), st = stat(every), any = every.length > 0 && S.ui !== "loading" && S.paneData === "recorded";
    return '<header class="ch"><div class="ttl"><div class="n">Flaky reconnect test</div><div class="f">' + I("folder-open", 13) + '<span class="mono">D:\\sparstrowgen</span></div></div>' +
      '<span class="toggle2" title="Not part of this design"><span class="on">Rendered</span><span>Raw</span></span>' +
      '<button class="hbtn" data-act="pane" aria-pressed="' + (S.pane === "open") + '" title="Changes">' + I("file-diff", 15) + '<span class="lbl">Changes</span>' + (any ? '<span class="cnt">' + statHtml(st).replace("</span><span", "</span> <span") + "</span>" : "") + "</button></header>";
  }

  function transcript() {
    if (S.ui === "loading") {
      return '<div class="mine" style="width:40%"><div class="sk" style="height:44px;border-radius:16px"></div></div>' +
        '<div><div class="sk" style="height:14px;width:140px;margin-bottom:10px"></div><div class="sk" style="height:14px;width:110px;margin-bottom:14px"></div><div class="sk" style="height:16px;width:100%;margin-bottom:8px"></div><div class="sk" style="height:16px;width:80%"></div></div>';
    }
    if (S.ui === "empty") {
      // A turn that did nothing but answer has no activity line and no
      // changes block — not "Worked for 0s", not "Changed 0 files".
      return mine("What does D-051 say about computers in a workspace?", "9:12 PM") +
        doneTurn({ id: "e", provider: "claude", model: "Haiku 4.5", time: "9:12 PM", worked: 0, usage: "2.1k tokens · $0.01", steps: [], files: [],
          answer: "<p>A computer is offered to workspaces, and that assignment is what routes the work: a workspace runs only on the computers it was given.</p>" });
    }
    if (S.ui === "error") {
      var t = { id: "x", provider: "claude", model: "Sonnet 5", time: "9:15 PM", worked: 12, usage: "8.2k tokens · $0.03", files: [],
        steps: CLAUDE.steps.slice(0, 5), answer: "<p>The reconnect test waits a fixed 200 ms, and on CI that is not long enough. I was about to</p>" };
      return mine("The reconnect test is flaky on CI. Find out why and fix it.", "9:15 PM") +
        doneTurn(t, '<div class="notice">' + I("octagon-x", 16) + '<div><div class="t">Turn did not finish</div><div>claude closed the connection before finishing (exit code 1). What it did and wrote before that is kept above.</div></div></div>');
    }
    var h = mine(CLAUDE.prompt, "9:04 PM") + doneTurn(CLAUDE) + mine(CODEX.prompt, "9:07 PM") + doneTurn(CODEX);
    if (S.ui === "running") h += mine(RUN.prompt, "9:09 PM") + (S.runDone ? doneTurn(RUN) : runningTurn());
    return h;
  }

  function render() {
    document.documentElement.classList.toggle("dark", S.theme === "dark");
    var app = document.getElementById("app");
    var sc = app.querySelector(".scroll"), df = document.getElementById("diffs");
    var keep = [sc ? sc.scrollTop : 0, df ? df.scrollTop : 0];
    app.dataset.max = S.pane === "open" && S.max;
    app.innerHTML = '<div class="chat">' + chatHeader() + '<div class="scroll"><main class="col" aria-label="Transcript">' + transcript() + "</main></div></div>" + (S.pane === "open" ? pane() : "");
    sc = app.querySelector(".scroll"); df = document.getElementById("diffs");
    if (sc) sc.scrollTop = keep[0];
    if (df) df.scrollTop = keep[1];
    if (S.focus && df) { var el = document.getElementById("f-" + S.focus); if (el) df.scrollTop = el.offsetTop - df.offsetTop - 12; }
    bar();
  }

  function bar() {
    function grp(label, key, opts) { return '<span class="grp"><b>' + label + "</b>" + opts.map(function (o) { return '<button data-act="set" data-k="' + key + '" data-v="' + o + '" aria-pressed="' + (S[key] === o) + '">' + o + "</button>"; }).join("") + "</span>"; }
    document.getElementById("bar").innerHTML = '<b style="font-weight:600">Prototype</b>' + grp("State", "ui", ["populated", "running", "empty", "loading", "error"]) +
      grp("Pane", "pane", ["closed", "open"]) + grp("Changes", "paneData", ["recorded", "loading", "error", "not-recorded"]) + grp("Theme", "theme", ["dark", "light"]) +
      (S.ui === "running" ? '<span class="grp"><button data-act="replay">Replay the running turn</button></span>' : "");
  }

  /* The running turn, simulated: a step arrives every ~1.4s, then the turn
     ends — the trail folds away, the answer takes its place, and its diffs
     appear under it. */
  var timer = null, clock = null;
  function play() {
    clearInterval(timer); clearInterval(clock);
    S.live = 0; S.elapsed = 0; S.runDone = false; delete S.open.r; delete S.detail.r;
    clock = setInterval(function () { S.elapsed += 0.1; var el = document.getElementById("elapsed"); if (el) el.textContent = S.elapsed.toFixed(1) + "s"; }, 100);
    timer = setInterval(function () {
      S.live++;
      if (S.live > RUN.steps.length) {
        clearInterval(timer); clearInterval(clock);
        RUN.worked = Math.round(S.elapsed); S.runDone = true;
      }
      render();
    }, 1400);
    render();
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var a = b.dataset.act;
    S.focus = null;
    if (a === "set") {
      S[b.dataset.k] = b.dataset.v;
      if (b.dataset.k === "ui") { S.scope = "all"; if (S.ui === "running") return play(); clearInterval(timer); clearInterval(clock); }
    }
    if (a === "replay") return play();
    if (a === "toggle") { var id = b.dataset.turn; S.open[id] = !S.open[id]; }
    if (a === "detail") { var t = b.dataset.turn, i = +b.dataset.i; S.detail[t] = S.detail[t] === i ? undefined : i; }
    if (a === "fold") S.fold[b.dataset.key] = !S.fold[b.dataset.key];
    if (a === "full") S.full[b.dataset.key] = true;
    if (a === "pane") S.pane = S.pane === "open" ? "closed" : "open";
    if (a === "close") { S.pane = "closed"; S.max = false; }
    if (a === "max") S.max = !S.max;
    if (a === "files") S.files = !S.files;
    if (a === "scope") { S.scope = b.dataset.v; if (narrow) S.files = false; }
    if (a === "goto") { S.focus = b.dataset.path; if (narrow) S.files = false; }
    if (a === "show") { S.pane = "open"; S.scope = b.dataset.turn; S.focus = b.dataset.path || null; if (narrow) S.files = false; }
    if (a === "retry") S.paneData = "recorded";
    render();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && S.pane === "open") { S.pane = "closed"; S.max = false; render(); } });

  if (S.ui === "running") play(); else render();
})();
</script>
</body>
</html>
