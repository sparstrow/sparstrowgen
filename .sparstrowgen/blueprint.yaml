# blueprint.yaml — the single place stack and command facts live.
# AGENTS.md, CLAUDE.md, and skills reference this instead of restating it.
# When the stack changes, change it here first.

project:
  name: sparstrowgen
  type: "web + local daemon"
  summary: >-
    One chat window across every coding-agent CLI installed on the machine.
    Conversations persist in our database, so a conversation can move to a
    different provider when one hits its usage limit.

# Nothing is scaffolded yet. Every entry below is a locked decision, not an
# observation of code that exists. Remove this block once apps/web and
# server/ actually build.
status: pre-scaffold

stack:
  frontend:
    framework: "Next.js (App Router)"
    styling: "Tailwind CSS v4"
    ui: "shadcn/ui via packages/ui"
    state: "TanStack Query for server state, Zustand for client state"
  server:
    language: "Go"
    module: "github.com/sparstrow/sparstrowgen/server"
    router: "Chi"
    transport: "WebSocket hub + HTTP"
  daemon:
    language: "Go"
    note: "Same Go module as the server so wire-protocol drift is a compile error"
  protocol:
    format: "Protobuf"
    codegen: "buf — generates Go structs and TypeScript types from proto/"
  database:
    engine: "PostgreSQL (self-hosted in Coolify)"
    access: "sqlc + pgx"
    migrations: "goose"
    vector: "pgvector"
  embeddings:
    placement: "separate HTTP service — never in-process"
    candidates: ["Ollama", "text-embeddings-inference"]
  infra:
    host: "Coolify on a Hostinger VPS"
    package_manager: "pnpm"
    monorepo: "Turborepo"
  desktop:
    shell: "Electron"
    status: "not started"
  mobile:
    framework: "Expo / React Native"
    status: "not started"

# Agent CLIs this app drives. It does not ship them; they must be installed
# and authenticated on the machine running the daemon. Availability is
# three-valued (available / waitable / blocked), adopted from Multica's
# AgentAvailability — see docs/Capabilities.md and docs/Decisions.md D-011.
agent_clis:
  - name: claude
    availability: available
    print: "-p --output-format stream-json --include-partial-messages --verbose"
    print_note: "--verbose is REQUIRED with --output-format stream-json in print mode, not obvious from --help"
    resume: "--resume <uuid> / --session-id <uuid>"
    model_flag: "--model"
    scoping: "MANDATORY --bare — see docs/KnownGaps.md G-3 (unscoped calls get working MCP tool access, verified)"
    usage_verified: true
    usage_fields: [input_tokens, cache_creation_input_tokens, cache_read_input_tokens, output_tokens, service_tier, inference_geo]
    cost_verified: true
    cost_field: "total_cost_usd (on the result event) — the only one of the three that reports real USD"
    rate_limit_signal:
      verified: true
      event_type: "rate_limit_event"
      fields: [status, resetsAt, rateLimitType, overageStatus, overageDisabledReason, isUsingOverage]
      note: "only status=allowed observed; the blocked/exceeded shape is unverified — see docs/KnownGaps.md G-4"
    incremental_streaming: unverified
    streaming_note: "--include-partial-messages is in the print string on documentation alone, never captured — see docs/KnownGaps.md G-5"
  - name: codex
    availability: available
    print: "codex exec --json --ignore-user-config"
    resume: "codex exec resume <session-id> <prompt>"
    model_flag: "-m"
    scoping: "MANDATORY --ignore-user-config — codex's equivalent of claude --bare; verified to silence all global MCP config while auth still works via CODEX_HOME"
    usage_verified: true
    usage_fields: [input_tokens, cached_input_tokens, cache_write_input_tokens, output_tokens, reasoning_output_tokens]
    incremental_streaming: false
    streaming_note: "VERIFIED NO DELTAS — no delta event type exists; one whole item.completed per turn. The UI must show progress without relying on text arriving."
  - name: agy
    availability: available
    print: "-p --output-format stream-json"
    resume: "--conversation <id>"
    model_flag: "--model"
    model_list: "agy models"
    usage_verified: true
    usage_fields: [input_tokens, output_tokens, thinking_tokens, cache_read_tokens, total_tokens]
    incremental_streaming: true
    streaming_note: "VERIFIED — step_update events with state=ACTIVE carry text_delta, ~25-35 chars each (93 for a 400-word answer). Short answers may arrive in one chunk; that is size, not absence."
  - name: gemini
    availability: blocked
    blocked_reason: "installed, no account signed in"
    status: "adapter not written — do not write one until availability changes; see docs/Later.md L-6"

commands:
  install: "pnpm install"
  dev: "turbo run dev"
  build: "turbo run build"
  test: "turbo run test"
  typecheck: "turbo run typecheck"
  go_test: "cd server && go test ./..."
  proto: "buf generate"

# How features get built. See AGENTS.md §2 — the owner approves a spec, then
# picks from rendered designs. There is no plan document.
workflow:
  method: design-driven
  loop: "spec -> feasibility -> shots (images, he picks a direction) -> design (clickable prototype, he picks details) -> wire on mocks (he confirms) -> backend -> verify"
  loop_principle: "each step is cheaper than the one after it, so the expensive step only runs on something already wanted"
  feasibility_gate: docs/Capabilities.md
  documents: "a spec the owner approves; no plan document"
  skills: [design-driven-feature, writing-specs, design-shots]
  agent_instructions: "AGENTS.md and CLAUDE.md are identical — edit one, copy to the other"

mcp_servers: [context7, shadcn]

cli_tools: [gh, docker, pnpm]

# Tools used to BUILD sparstrowgen, as distinct from the agent_clis the product
# drives at runtime. Same binary, different job — do not apply the daemon's
# scoping rules here.
build_tools:
  image_generation:
    via: "codex exec --json --skip-git-repo-check, asking it to use its imagegen skill"
    verified: true
    verified_note: "2026-09-09 from an agent shell: produced a clean UI mockup in ~2 min, ~88k input tokens (mostly cached preamble)"
    output_path: "~/.codex/generated_images/<thread>/<exec>.png — name an absolute destination in the prompt and it copies the file there"
    scoping: "do NOT pass --ignore-user-config here; it risks stripping the skill. The mandatory-scoping rule is for the daemon's runtime adapter only."
    used_by: design-shots
    caveats:
      - "one image per run — asking for several returns one image and prose about the rest"
      - "prompts regress to the category mean; name the product-specific elements or you get a stock design"
      - "ask for greeked placeholder bars instead of text — generated pseudo-words dominate every reaction"
