# blueprint.yaml — the single place stack and command facts live.
# AGENTS.md, CLAUDE.md, and skills reference this instead of restating it.
# When the stack changes, change it here first.

project:
  name: sparstrowgen
  type: "web + local daemon"
  summary: >-
    One chat window across every coding-agent CLI installed on the machine.
    Conversations persist in our database, so a conversation can move to a
    different provider when one hits its usage limit.

# The full path works end to end on real data: browser -> server -> daemon ->
# agent CLI -> back. Verified 2026-09-10 by moving one conversation across
# codex -> agy -> codex with the replay quoted, charged and recorded.
# claude is built but cannot authenticate from a spawned process (KnownGaps G-9).
status: working-vertical-slice

stack:
  frontend:
    framework: "Next.js 16.3.4 (App Router, Turbopack)"
    react: "19.2.8"
    styling: "Tailwind CSS v4"
    ui: "shadcn 4.21 (Base UI, style base-nova, neutral) — currently in apps/web/components/ui"
    ui_note: "NOT yet extracted to packages/ui — one consumer, so extraction would be speculative (AGENTS.md rule 4). Mechanical move when apps/desktop lands; see docs/Later.md L-7"
    state: "TanStack Query owns server state (apps/web/lib/queries.ts), Zustand owns view state (apps/web/lib/store.ts). Websocket events PATCH the Query cache and are never mirrored into the store. Rename and archive are optimistic with rollback; sending a message is not, because a model's answer is not predictable."
  server:
    language: "Go"
    module: "github.com/sparstrow/sparstrowgen/server"
    router: "Chi"
    transport: "WebSocket hub + HTTP"
  daemon:
    language: "Go"
    note: "Same Go module as the server so wire-protocol drift is a compile error"
  protocol:
    format: "JSON over WebSocket — Go structs with json tags in server/internal/protocol"
    codegen: "NONE. Protobuf/buf is DEFERRED, not chosen — see docs/Decisions.md D-017. Multica has the same architecture and zero .proto files. Until it lands, protocol.go and apps/web/lib/chat-types.ts are hand-kept in step: change both in one commit."
  database:
    engine: "PostgreSQL 17 + pgvector (docker compose locally on :5433, Coolify in production)"
    access: "sqlc + pgx v5"
    migrations: "goose — server/migrations"
    vector: "pgvector — extension present, not yet used by any migration"
    search: "pg_trgm. Substring search over titles, folders and message bodies; a GIN full-text index cannot serve a leading-wildcard ILIKE, which is the query this feature actually needs."
  embeddings:
    placement: "separate HTTP service — never in-process"
    candidates: ["Ollama", "text-embeddings-inference"]
  infra:
    host: "Coolify on a Hostinger VPS"
    package_manager: "pnpm 11.6 workspace"
    monorepo: "pnpm workspaces — Turborepo not added yet, one buildable package does not need an orchestrator"
  desktop:
    shell: "Electron"
    status: "not started"
  mobile:
    framework: "Expo / React Native"
    status: "not started"

# Agent CLIs this app drives. It does not ship them; they must be installed
# and authenticated on the machine running the daemon. Availability is
# three-valued (available / waitable / blocked), adopted from Multica's
# AgentAvailability — see docs/Capabilities.md and docs/Decisions.md D-011.
agent_clis:
  - name: claude
    availability: available
    print: "-p --output-format stream-json --include-partial-messages --verbose --strict-mcp-config --setting-sources project"
    print_note: "--verbose is REQUIRED with --output-format stream-json in print mode, not obvious from --help"
    resume: "--resume <uuid> / --session-id <uuid>"
    model_flag: "--model"
    model_list: "list_models CONTROL REQUEST over stream-json — no user message, nothing billed. Unsupported on our 2.1.90; works on 2.1.223+ (Multica does this). Fall back to a static catalogue. Aliases verified today: opus=claude-opus-4-6, sonnet=claude-sonnet-4-6, haiku=claude-haiku-4-5-20251001. See docs/KnownGaps.md G-8"
    scoping: "MANDATORY --strict-mcp-config --setting-sources project — VERIFIED 2026-09-10: 0 MCP servers, skills 72->17, OAuth still works (apiKeySource 'none'). Do NOT use --bare: it never reads OAuth or the keychain and cannot authenticate a subscription account."
    env_scrubbing: "MANDATORY — the daemon must clear CLAUDE_* and ANTHROPIC_* before spawning. Inherited nested-session vars (CLAUDE_CODE_MESSAGING_SOCKET, CLAUDECODE=1) make claude -p hang indefinitely; verified 2026-09-10, two runs killed at 120s."
    usage_verified: true
    usage_fields: [input_tokens, cache_creation_input_tokens, cache_read_input_tokens, output_tokens, service_tier, inference_geo]
    cost_verified: true
    cost_field: "total_cost_usd (on the result event) — the only one of the three that reports real USD"
    rate_limit_signal:
      verified: true
      event_type: "rate_limit_event"
      fields: [status, resetsAt, rateLimitType, overageStatus, overageDisabledReason, isUsingOverage]
      note: "only status=allowed observed; the blocked/exceeded shape is unverified — see docs/KnownGaps.md G-4"
    incremental_streaming: true
    streaming_note: "VERIFIED 2026-09-10 once auth worked — 89 content_block_delta events averaging 8.1 chars for a four-sentence answer, the finest-grained of the three (agy is 25-35). REQUIRES --include-partial-messages. Earlier captures showed zero deltas only because the turns were 401ing before reaching the API."
    auth: "WORKS via CLAUDE_CODE_OAUTH_TOKEN (set at User scope on this machine). Without it, blocked from a spawned process — the stored OAuth access token is expired and only the desktop app refreshes it. Fix is `claude setup-token` + CLAUDE_CODE_OAUTH_TOKEN (exempted from env scrubbing). See docs/runbooks/claude-headless-auth.md and KnownGaps G-9. NOTE: the failing result event says subtype:success with is_error:true — read is_error."
  - name: codex
    availability: available
    print: "codex exec --json --ignore-user-config --skip-git-repo-check"
    stream_events: "thread.started(thread_id) -> turn.started -> item.completed(item.type=agent_message, item.text) -> turn.completed(usage). Captured 2026-09-10."
    resume: "codex exec resume <session-id> <prompt>"
    model_flag: "-m"
    model_list: "NONE — no list command. Names scraped from the shipped binary; configured model read from ~/.codex/config.toml. The valid set is ACCOUNT-DEPENDENT — an unsupported model returns 400 'not supported when using Codex with a ChatGPT account'. See docs/KnownGaps.md G-8"
    scoping: "MANDATORY --ignore-user-config — codex's equivalent of claude --bare; verified to silence all global MCP config while auth still works via CODEX_HOME"
    usage_verified: true
    usage_fields: [input_tokens, cached_input_tokens, cache_write_input_tokens, output_tokens, reasoning_output_tokens]
    incremental_streaming: false
    streaming_note: "VERIFIED NO DELTAS — no delta event type exists; one whole item.completed per turn. The UI must show progress without relying on text arriving."
  - name: agy
    availability: available
    print: "-p --output-format stream-json"
    stream_events: "keys on 'event', NOT 'type': init(conversation_id) -> step_update(text_delta) -> result(status, response, usage). Captured 2026-09-10."
    resume: "--conversation <id>"
    model_flag: "--model"
    model_list: "agy models — VERIFIED, the only one of the three that enumerates. Returns id + label, 14 entries"
    routes: true
    routes_note: "agy is a ROUTER, not a vendor: it serves Gemini, Claude and GPT-OSS models behind one CLI. Reasoning effort is baked into the model id (gemini-3.1-pro-high vs -low), not a separate setting — so there is no effort control to build."
    usage_verified: true
    usage_fields: [input_tokens, output_tokens, thinking_tokens, cache_read_tokens, total_tokens]
    incremental_streaming: true
    streaming_note: "VERIFIED — step_update events with state=ACTIVE carry text_delta, ~25-35 chars each (93 for a 400-word answer). Short answers may arrive in one chunk; that is size, not absence."
  # gemini was here. Removed from the product on 2026-09-10 — see docs/Decisions.md D-014.
  # Do not add it back without the owner asking for it.

commands:
  install: "pnpm install"
  dev: "pnpm dev            # next dev on :3000"
  build: "pnpm build"
  lint: "pnpm lint"
  typecheck: "pnpm typecheck"
  go_test: "cd server && go test ./..."
  go_test_linux: "make test-linux   # the Go suite on Linux under -race, in a container. Needed because the daemon only ever runs on Windows and -race needs a C compiler this machine does not have. --init is load-bearing; see docs/KnownGaps.md G-17"
  db: "docker compose -f compose.dev.yaml up -d   # postgres on :5433"
  migrate: "cd server && goose -dir migrations up"
  server: "cd server && go run ./cmd/server   # :8080"
  daemon: "cd server && go run ./cmd/daemon   # drives the agent CLIs"
  windows_installer: "powershell -ExecutionPolicy Bypass -File scripts\\package-windows.ps1 -Version x.y.z   # dist\\windows: sparstrowgen-setup.exe plus the update manifest, for api.sparstrow.com; -ServerAPI/-ServerWS for another server. Only to try a build: releases come from daemon_release (D-033, D-035)"
  daemon_release: "git tag -a daemon-vx.y.z <commit on main> -m \"what changed\" && git push origin daemon-vx.y.z   # .github/workflows/daemon-release.yml tests, builds and publishes it as latest; no key (docs/runbooks/daemon-release.md)"
  check: "make check"

# Settings the daemon reads at startup. Everything else is compiled in.
daemon_env:
  SERVER_WS: "where to dial the server. Default ws://localhost:8080/daemon"
  CLAUDE_CODE_OAUTH_TOKEN: "required for claude; exempted from env scrubbing on purpose"
  TURN_IDLE_TIMEOUT: "how long a turn may produce NOTHING before it is ended. Go duration, default 15m. Inactivity, NOT a wall-clock cap — a turn streaming for an hour is fine. Tightest on codex, which is silent between its session id and its finished answer. See docs/Decisions.md D-023"

# How features get built. See AGENTS.md §2 — the owner approves a spec, then
# picks from rendered designs. There is no plan document.
workflow:
  method: design-driven
  loop: "spec -> feasibility -> shots (images, he picks a direction) -> design (clickable prototype, he picks details) -> wire on mocks (he confirms) -> backend -> verify"
  loop_principle: "each step is cheaper than the one after it, so the expensive step only runs on something already wanted"
  feasibility_gate: docs/Capabilities.md
  documents: "a spec the owner approves; no plan document"
  skills: [design-driven-feature, writing-specs, design-shots]
  agent_instructions: "AGENTS.md and CLAUDE.md are identical — edit one, copy to the other"

mcp_servers: [context7, shadcn]

cli_tools: [gh, docker, pnpm]

# Tools used to BUILD sparstrowgen, as distinct from the agent_clis the product
# drives at runtime. Same binary, different job — do not apply the daemon's
# scoping rules here.
build_tools:
  image_generation:
    via: "codex exec --json --skip-git-repo-check, asking it to use its imagegen skill"
    verified: true
    verified_note: "2026-09-09 from an agent shell: produced a clean UI mockup in ~2 min, ~88k input tokens (mostly cached preamble)"
    output_path: "~/.codex/generated_images/<thread>/<exec>.png — name an absolute destination in the prompt and it copies the file there"
    scoping: "do NOT pass --ignore-user-config here; it risks stripping the skill. The mandatory-scoping rule is for the daemon's runtime adapter only."
    used_by: design-shots
    caveats:
      - "one image per run — asking for several returns one image and prose about the rest"
      - "prompts regress to the category mean; name the product-specific elements or you get a stock design"
      - "write the REAL content into the prompt — actual names, labels, numbers, message text. Greeked placeholder bars were tried first and rejected by the owner: a screen of grey rectangles cannot be judged. Imperfect generated text is the cheaper failure."
      - "prompts need 200-300 words, region by region; short prompts return stock designs"
